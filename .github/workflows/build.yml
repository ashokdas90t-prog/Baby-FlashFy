name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check APK
        run: |
          set -e
          test -s base.apk
          test -s split_config.arm64_v8a.apk
          ls -lh base.apk split_config.arm64_v8a.apk

      - name: Install Flutter AOT decompiler
        run: |
          set -e

          curl -fL \
            "https://github.com/caverav/flutterdec/releases/download/v0.1.0-alpha.4/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz" \
            -o flutterdec.tar.gz

          mkdir -p flutterdec-dist
          tar -xzf flutterdec.tar.gz -C flutterdec-dist

          chmod +x flutterdec-dist/bin/flutterdec

          ./flutterdec-dist/bin/flutterdec --version || true

      - name: Inspect Flutter AOT snapshot
        run: |
          set -e

          mkdir -p analysis

          ./flutterdec-dist/bin/flutterdec \
            info base.apk --json \
            > analysis/info.json 2>&1 || true

          cat analysis/info.json

      - name: Install matching AOT adapter
        run: |
          set -e

          HASH="$(python3 - <<'PY'
          import json
          p="analysis/info.json"
          try:
              d=json.load(open(p))
          except Exception:
              d={}
          h=d.get("snapshot_hash","")
          print(h if isinstance(h,str) else "")
          PY
          )"

          echo "Detected snapshot hash: $HASH"

          if [ -z "$HASH" ]; then
            echo "Could not detect snapshot hash."
            exit 1
          fi

          ./flutterdec-dist/bin/flutterdec \
            adapter install --dart-hash "$HASH" || true

          ./flutterdec-dist/bin/flutterdec \
            adapter list || true

      - name: Decompile app-owned Flutter code
        run: |
          set -e

          mkdir -p analysis/decompiled

          ./flutterdec-dist/bin/flutterdec \
            decompile base.apk \
            -o analysis/decompiled \
            --function-scope app-unknown \
            --emit-asm \
            --emit-ir \
            > analysis/decompile.log 2>&1 || true

          echo "===== DECOMPILER LOG ====="
          cat analysis/decompile.log

          echo "===== TARGET FUNCTION SEARCH ====="

          grep -RniE \
            "_RopeBulbPainter|_drawBulb|_drawPullRope|_paintBackgroundImage|_BackgroundPainter|FlashfyScreen|flash_on|flash_off" \
            analysis/decompiled \
            > analysis/target-functions.txt || true

          cat analysis/target-functions.txt || true

      - name: Create focused report
        run: |
          set -e

          {
            echo "FlashFy Flutter AOT analysis"
            echo
            echo "Target functions:"
            grep -RniE \
              "_RopeBulbPainter|_drawBulb|_drawPullRope|_paintBackgroundImage|_BackgroundPainter|FlashfyScreen" \
              analysis/decompiled 2>/dev/null || true
            echo
            echo "Image references:"
            grep -RniE \
              "flash_on|flash_off|drawImage|AssetImage|ImageProvider|paintImage" \
              analysis/decompiled 2>/dev/null || true
          } > analysis/FOCUSED-REPORT.txt

          cat analysis/FOCUSED-REPORT.txt

      - name: Upload AOT analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-analysis
          path: analysis/
          if-no-files-found: error
