name: Build FlashFy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget

      - name: Download APK signer
        run: |
          wget -q \
            https://github.com/patrickfav/uber-apk-signer/releases/latest/download/uber-apk-signer-1.3.0.jar \
            -O uber-apk-signer.jar

      - name: Prepare
        run: |
          mkdir -p work
          mkdir -p output

          cp base.apk work/base.apk
          cp split_config.arm64_v8a.apk work/split_config.arm64_v8a.apk
          cp split_config.en.apk work/split_config.en.apk
          cp split_config.xxhdpi.apk work/split_config.xxhdpi.apk

      - name: Replace flash ON image
        run: |
          mkdir -p work/base_extract

          cd work/base_extract
          unzip -q ../base.apk

          test -f ../../bg.png

          mkdir -p assets/flutter_assets/assets

          cp ../../bg.png \
            assets/flutter_assets/assets/flash_on.png

          cd ..

          rm -f base.apk

          zip -qr -0 base.apk .

          cd ..

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, L=Unknown, ST=Unknown, C=US"

      - name: Sign all APKs
        run: |
          java -jar uber-apk-signer.jar \
            --apks work \
            --ks flashfy.keystore \
            --ksAlias flashfy \
            --ksPass pass:flashfy123 \
            --ksKeyPass pass:flashfy123 \
            --out output \
            --allowResign

      - name: List output
        run: |
          echo "===== OUTPUT ====="
          ls -lah output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-modified
          path: output/
