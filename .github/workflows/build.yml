name: Build FlashFy - Single APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input files
        run: |
          set -e

          test -f base.apk
          test -f split_config.arm64_v8a.apk
          test -f split_config.en.apk
          test -f split_config.xxhdpi.apk
          test -f bg.png

          mkdir -p work/apks
          mkdir -p work/merged_extract
          mkdir -p output

          cp base.apk work/apks/base.apk
          cp split_config.arm64_v8a.apk work/apks/
          cp split_config.en.apk work/apks/
          cp split_config.xxhdpi.apk work/apks/

      - name: Download APKEditor
        run: |
          set -e

          curl -fL \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar \
            -o APKEditor.jar

          test -s APKEditor.jar
          ls -lh APKEditor.jar

      - name: Merge split APKs
        run: |
          set -e

          java -Xmx4g -jar APKEditor.jar m \
            -i work/apks \
            -o output/FlashFy-merged-unsigned.apk \
            -clean-meta \
            -f

          test -s output/FlashFy-merged-unsigned.apk

          echo "Merged APK:"
          ls -lh output/FlashFy-merged-unsigned.apk

      - name: Replace flash ON image in merged APK
        run: |
          set -e

          echo "Extracting merged APK..."

          rm -rf work/merged_extract
          mkdir -p work/merged_extract

          unzip -q \
            output/FlashFy-merged-unsigned.apk \
            -d work/merged_extract

          test -f work/merged_extract/AndroidManifest.xml

          TARGET="work/merged_extract/assets/flutter_assets/assets/flash_on.png"

          echo "Checking target:"
          echo "$TARGET"

          test -f "$TARGET"

          echo "Replacing flash_on.png..."

          cp bg.png "$TARGET"

          SOURCE_HASH=$(sha256sum bg.png | awk '{print $1}')
          TARGET_HASH=$(sha256sum "$TARGET" | awk '{print $1}')

          echo "Source hash: $SOURCE_HASH"
          echo "Target hash: $TARGET_HASH"

          test "$SOURCE_HASH" = "$TARGET_HASH"

          echo "Creating modified APK..."

          rm -f output/FlashFy-merged-unsigned.apk

          cd work/merged_extract

          zip -q -r -0 \
            ../../output/FlashFy-final-unsigned.apk \
            .

          cd ../..

          test -s output/FlashFy-final-unsigned.apk

          echo "Modified APK created."

      - name: Locate Android build tools
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using $BUILD_TOOLS"

      - name: Create signing key
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, C=US"

      - name: Zipalign final APK
        run: |
          set -e

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            output/FlashFy-final-unsigned.apk \
            output/FlashFy-aligned.apk

          rm -f output/FlashFy-final-unsigned.apk

      - name: Sign final APK
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" sign \
            --ks flashfy.keystore \
            --ks-key-alias flashfy \
            --ks-pass pass:flashfy123 \
            --key-pass pass:flashfy123 \
            --out output/FlashFy-universal.apk \
            output/FlashFy-aligned.apk

          rm -f output/FlashFy-aligned.apk

          test -s output/FlashFy-universal.apk

      - name: Verify final APK
        run: |
          set -e

          echo "Verifying signature..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            output/FlashFy-universal.apk

          echo "Checking manifest..."

          unzip -l output/FlashFy-universal.apk \
            | grep -F "AndroidManifest.xml"

          echo "Checking flash_on.png..."

          unzip -l output/FlashFy-universal.apk \
            | grep -F "assets/flutter_assets/assets/flash_on.png"

          rm -rf work/verify
          mkdir -p work/verify

          unzip -q \
            output/FlashFy-universal.apk \
            -d work/verify

          SOURCE_HASH=$(sha256sum bg.png | awk '{print $1}')
          FINAL_HASH=$(sha256sum \
            work/verify/assets/flutter_assets/assets/flash_on.png \
            | awk '{print $1}')

          echo "bg.png hash: $SOURCE_HASH"
          echo "Final image hash: $FINAL_HASH"

          test "$SOURCE_HASH" = "$FINAL_HASH"

          echo "======================================"
          echo "SUCCESS"
          echo "The supplied bg.png is inside the"
          echo "final FlashFy APK as flash_on.png."
          echo "======================================"

          ls -lh output/FlashFy-universal.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-single-APK
          path: output/FlashFy-universal.apk
          if-no-files-found: error
