name: Build FlashFy - Baby Image FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - "base.apk"
      - "split_config.arm64_v8a.apk"
      - "split_config.en.apk"
      - "split_config.xxhdpi.apk"
      - "bg-fixed.png"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check inputs and image format
        run: |
          set -e

          for f in base.apk split_config.arm64_v8a.apk split_config.en.apk split_config.xxhdpi.apk bg-fixed.png; do
            test -s "$f"
          done

          echo "Files:"
          ls -lh base.apk split_config.arm64_v8a.apk split_config.en.apk split_config.xxhdpi.apk bg-fixed.png

          echo "Image file type:"
          file bg-fixed.png

          python3 - <<'PY'
          from PIL import Image
          im = Image.open("bg-fixed.png")
          print("format =", im.format)
          print("size   =", im.size)
          print("mode   =", im.mode)
          assert im.format == "PNG", "bg-fixed.png is not a real PNG"
          assert im.size == (864, 1536), "Unexpected image dimensions"
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKEditor 1.4.9
        run: |
          set -e

          curl -fL \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" \
            -o APKEditor.jar

          test -s APKEditor.jar
          ls -lh APKEditor.jar

      - name: Prepare split APKs
        run: |
          set -e

          rm -rf work output
          mkdir -p work/apks output

          cp base.apk work/apks/
          cp split_config.arm64_v8a.apk work/apks/
          cp split_config.en.apk work/apks/
          cp split_config.xxhdpi.apk work/apks/

      - name: Merge split APKs
        run: |
          set -e

          java -Xmx4g -jar APKEditor.jar m \
            -i work/apks \
            -o output/merged-unsigned.apk \
            -clean-meta \
            -f

          test -s output/merged-unsigned.apk
          ls -lh output/merged-unsigned.apk

      - name: Replace Flutter ON image with real PNG
        run: |
          set -e

          rm -rf work/merged
          mkdir -p work/merged

          unzip -q output/merged-unsigned.apk -d work/merged

          TARGET="work/merged/assets/flutter_assets/assets/flash_on.png"

          test -f "$TARGET"

          echo "Before replacement:"
          file "$TARGET"

          cp -f bg-fixed.png "$TARGET"

          echo "After replacement:"
          file "$TARGET"

          python3 - <<'PY'
          from PIL import Image
          p = "work/merged/assets/flutter_assets/assets/flash_on.png"
          im = Image.open(p)
          print("Final embedded image:", im.format, im.size, im.mode)
          assert im.format == "PNG"
          assert im.size == (864, 1536)
          PY

          SOURCE_HASH="$(sha256sum bg-fixed.png | awk '{print $1}')"
          TARGET_HASH="$(sha256sum "$TARGET" | awk '{print $1}')"

          echo "Source PNG hash:   $SOURCE_HASH"
          echo "Embedded hash:     $TARGET_HASH"

          test "$SOURCE_HASH" = "$TARGET_HASH"

          echo "IMAGE REPLACEMENT: PASS"

      - name: Repack modified APK
        run: |
          set -e

          rm -f output/modified-unsigned.apk

          (
            cd work/merged
            zip -q -r -0 ../../output/modified-unsigned.apk .
          )

          test -s output/modified-unsigned.apk
          ls -lh output/modified-unsigned.apk

      - name: Find Android build tools
        run: |
          set -e

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Create signing key
        run: |
          set -e

          keytool -genkeypair -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, C=US"

      - name: Zipalign
        run: |
          set -e

          "$BUILD_TOOLS/zipalign" \
            -f -p 4 \
            output/modified-unsigned.apk \
            output/aligned.apk

          "$BUILD_TOOLS/zipalign" -c -v 4 output/aligned.apk

      - name: Sign
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" sign \
            --ks flashfy.keystore \
            --ks-key-alias flashfy \
            --ks-pass pass:flashfy123 \
            --key-pass pass:flashfy123 \
            --out output/FlashFy-universal.apk \
            output/aligned.apk

          test -s output/FlashFy-universal.apk

      - name: FINAL verification
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" verify --verbose output/FlashFy-universal.apk

          rm -rf work/final_check
          mkdir -p work/final_check

          unzip -q output/FlashFy-universal.apk -d work/final_check

          FINAL_IMAGE="work/final_check/assets/flutter_assets/assets/flash_on.png"

          test -f "$FINAL_IMAGE"

          file "$FINAL_IMAGE"

          python3 - <<'PY'
          from PIL import Image
          p = "work/final_check/assets/flutter_assets/assets/flash_on.png"
          im = Image.open(p)
          print("FINAL embedded image:", im.format, im.size, im.mode)
          assert im.format == "PNG"
          assert im.size == (864, 1536)
          PY

          SOURCE_HASH="$(sha256sum bg-fixed.png | awk '{print $1}')"
          FINAL_HASH="$(sha256sum "$FINAL_IMAGE" | awk '{print $1}')"

          echo "Source PNG hash: $SOURCE_HASH"
          echo "Final APK image hash: $FINAL_HASH"

          test "$SOURCE_HASH" = "$FINAL_HASH"

          echo "======================================"
          echo "FINAL IMAGE CHECK: PASS"
          echo "FINAL APK CHECK: PASS"
          echo "======================================"

          ls -lh output/FlashFy-universal.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-single-APK-FINAL
          path: output/FlashFy-universal.apk
          if-no-files-found: error
