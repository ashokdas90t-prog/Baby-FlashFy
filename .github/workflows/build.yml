name: Build FlashFy - Single APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input files
        run: |
          set -e

          test -f base.apk
          test -f split_config.arm64_v8a.apk
          test -f split_config.en.apk
          test -f split_config.xxhdpi.apk
          test -f bg.png

          mkdir -p work/apks work/base_extract output

          cp base.apk work/apks/base.apk
          cp split_config.arm64_v8a.apk work/apks/
          cp split_config.en.apk work/apks/
          cp split_config.xxhdpi.apk work/apks/

      - name: Replace Flutter flash ON image
        run: |
          set -e

          cd work/base_extract
          unzip -q ../apks/base.apk

          test -f AndroidManifest.xml
          test -f assets/flutter_assets/assets/flash_on.png

          cp ../../bg.png assets/flutter_assets/assets/flash_on.png

          test -f assets/flutter_assets/assets/flash_on.png

          # Recreate base.apk with AndroidManifest.xml at APK root.
          cd ..
          rm -f apks/base.apk

          cd base_extract
          zip -q -r -0 ../apks/base.apk .
          cd ../..

          echo "Modified base.apk ready."

      - name: Download APKEditor
        run: |
          set -e

          URL=$(curl -fsSL \
            https://api.github.com/repos/REAndroid/APKEditor/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' \
            | head -n 1)

          test -n "$URL"

          echo "Downloading: $URL"
          curl -fL "$URL" -o APKEditor.jar

          java -jar APKEditor.jar -version

      - name: Merge all split APKs into one APK
        run: |
          set -e

          java -Xmx4g -jar APKEditor.jar m \
            -i work/apks \
            -o output/FlashFy-universal-unsigned.apk \
            -clean-meta \
            -f

          test -f output/FlashFy-universal-unsigned.apk

      - name: Create signing key
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, C=US"

      - name: Locate Android build tools
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          test -x "$BUILD_TOOLS/apksigner"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Sign single APK
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" sign \
            --ks flashfy.keystore \
            --ks-key-alias flashfy \
            --ks-pass pass:flashfy123 \
            --key-pass pass:flashfy123 \
            --out output/FlashFy-universal.apk \
            output/FlashFy-universal-unsigned.apk

          rm -f output/FlashFy-universal-unsigned.apk

      - name: Verify final APK
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" verify --verbose output/FlashFy-universal.apk

          unzip -l output/FlashFy-universal.apk \
            | grep 'AndroidManifest.xml'

          unzip -l output/FlashFy-universal.apk \
            | grep 'assets/flutter_assets/assets/flash_on.png'

          echo "===== FINAL APK ====="
          ls -lh output/FlashFy-universal.apk

      - name: Upload single APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-single-APK
          path: output/FlashFy-universal.apk
          if-no-files-found: error
