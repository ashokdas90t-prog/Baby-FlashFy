name: Build FlashFy - Final Single APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input files
        run: |
          set -e
          test -f base.apk
          test -f split_config.arm64_v8a.apk
          test -f split_config.en.apk
          test -f split_config.xxhdpi.apk
          test -f bg.png
          mkdir -p work/apks work/merged output
          cp base.apk work/apks/base.apk
          cp split_config.arm64_v8a.apk work/apks/
          cp split_config.en.apk work/apks/
          cp split_config.xxhdpi.apk work/apks/

      - name: Download APKEditor
        run: |
          set -e
          curl -fL https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar -o APKEditor.jar
          test -s APKEditor.jar
          java -jar APKEditor.jar -version

      - name: Merge split APKs
        run: |
          set -e
          java -Xmx4g -jar APKEditor.jar m \
            -i work/apks \
            -o output/merged-unsigned.apk \
            -clean-meta \
            -f
          test -s output/merged-unsigned.apk

      - name: Replace flash ON image
        run: |
          set -e
          rm -rf work/merged
          mkdir -p work/merged
          unzip -q output/merged-unsigned.apk -d work/merged

          test -f work/merged/AndroidManifest.xml

          TARGET="work/merged/assets/flutter_assets/assets/flash_on.png"
          test -f "$TARGET"

          cp -f bg.png "$TARGET"

          SOURCE_HASH="$(sha256sum bg.png | awk '{print $1}')"
          TARGET_HASH="$(sha256sum "$TARGET" | awk '{print $1}')"

          echo "bg.png:       $SOURCE_HASH"
          echo "flash_on.png: $TARGET_HASH"

          test "$SOURCE_HASH" = "$TARGET_HASH"

      - name: Rebuild modified APK
        run: |
          set -e
          rm -f output/modified-unsigned.apk
          cd work/merged
          zip -q -r -0 ../../output/modified-unsigned.apk .
          cd ../..
          test -s output/modified-unsigned.apk

      - name: Locate Android build tools
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Create signing key
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, C=US"

      - name: Zipalign
        run: |
          set -e
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            output/modified-unsigned.apk \
            output/aligned.apk
          test -s output/aligned.apk

      - name: Sign APK
        run: |
          set -e
          "$BUILD_TOOLS/apksigner" sign \
            --ks flashfy.keystore \
            --ks-key-alias flashfy \
            --ks-pass pass:flashfy123 \
            --key-pass pass:flashfy123 \
            --out output/FlashFy-universal.apk \
            output/aligned.apk
          test -s output/FlashFy-universal.apk

      - name: Final verification
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" verify --verbose \
            output/FlashFy-universal.apk

          unzip -l output/FlashFy-universal.apk | grep -F "AndroidManifest.xml"
          unzip -l output/FlashFy-universal.apk | grep -F "assets/flutter_assets/assets/flash_on.png"

          rm -rf work/final_check
          mkdir -p work/final_check

          unzip -q output/FlashFy-universal.apk -d work/final_check

          FINAL_IMAGE="work/final_check/assets/flutter_assets/assets/flash_on.png"
          test -f "$FINAL_IMAGE"

          SOURCE_HASH="$(sha256sum bg.png | awk '{print $1}')"
          FINAL_HASH="$(sha256sum "$FINAL_IMAGE" | awk '{print $1}')"

          echo "Source bg.png: $SOURCE_HASH"
          echo "Final image:  $FINAL_HASH"

          test "$SOURCE_HASH" = "$FINAL_HASH"

          echo "SUCCESS: bg.png is inside the final APK as flash_on.png."
          ls -lh output/FlashFy-universal.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-single-APK
          path: output/FlashFy-universal.apk
          if-no-files-found: error
