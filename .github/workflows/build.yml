name: Build FlashFy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          rm -rf work output
          mkdir -p work/base_extract
          mkdir -p output

          cp base.apk work/base-original.apk

          for f in split_config.arm64_v8a.apk split_config.en.apk split_config.xxhdpi.apk; do
            if [ -f "$f" ]; then
              cp "$f" work/
            fi
          done

      - name: Replace flash ON image
        run: |
          cd work/base_extract

          unzip -q ../base-original.apk

          echo "Checking original APK..."
          test -f AndroidManifest.xml
          test -f assets/flutter_assets/assets/flash_on.png

          echo "Replacing flash_on.png..."
          cp ../../bg.png \
            assets/flutter_assets/assets/flash_on.png

          echo "Checking modified APK files..."
          test -f AndroidManifest.xml
          test -f assets/flutter_assets/assets/flash_on.png

          echo "Creating modified base APK..."

          # IMPORTANT:
          # ZIP MUST be created from inside base_extract,
          # so AndroidManifest.xml stays at APK root.
          zip -q -r -0 ../base.apk .

          cd ..

          rm -rf base_extract base-original.apk

          echo "Checking rebuilt APK..."
          unzip -l base.apk | grep -E 'AndroidManifest.xml|flash_on.png'

      - name: Find Android build tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$BUILD_TOOLS"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore flashfy.keystore \
            -alias flashfy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass flashfy123 \
            -keypass flashfy123 \
            -dname "CN=FlashFy, OU=FlashFy, O=FlashFy, C=US"

      - name: Align APKs
        run: |
          mkdir -p work/aligned

          for apk in work/*.apk; do
            name=$(basename "$apk")

            echo "Aligning $name"

            "$BUILD_TOOLS/zipalign" \
              -f -p 4 \
              "$apk" \
              "work/aligned/$name"
          done

      - name: Sign APKs
        run: |
          mkdir -p output

          for apk in work/aligned/*.apk; do
            name=$(basename "$apk")

            echo "Signing $name"

            "$BUILD_TOOLS/apksigner" sign \
              --ks flashfy.keystore \
              --ks-key-alias flashfy \
              --ks-pass pass:flashfy123 \
              --key-pass pass:flashfy123 \
              --out "output/$name" \
              "$apk"
          done

      - name: Verify APKs
        run: |
          for apk in output/*.apk; do
            echo "================================"
            echo "VERIFYING: $apk"
            echo "================================"

            "$BUILD_TOOLS/apksigner" verify --verbose "$apk"

            echo
            echo "Checking AndroidManifest.xml:"
            unzip -l "$apk" | grep "AndroidManifest.xml"
          done

      - name: Upload modified APKs
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-modified
          path: output/*.apk
          if-no-files-found: error
