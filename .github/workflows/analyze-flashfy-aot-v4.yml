name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check APK input
        shell: bash
        run: |
          set -e
          test -f split_config.arm64_v8a.apk
          mkdir -p work/native
          echo "APK input OK"

      - name: Extract libapp.so
        shell: bash
        run: |
          set -e
          unzip -p split_config.arm64_v8a.apk \
            lib/arm64-v8a/libapp.so > work/native/libapp.so
          test -s work/native/libapp.so
          ls -lh work/native/libapp.so

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect AOT snapshot
        shell: bash
        run: |
          set -e

          mkdir -p work

          nix run github:caverav/flutterdec -- \
            info work/native/libapp.so --json \
            > work/info.raw 2> work/info.stderr || true

          cat work/info.stderr || true
          cat work/info.raw || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path("work/info.raw").read_text(errors="replace")
          decoder = json.JSONDecoder()
          found = None

          for i, ch in enumerate(raw):
              if ch != "{":
                  continue
              try:
                  obj, _ = decoder.raw_decode(raw[i:])
              except Exception:
                  continue
              if isinstance(obj, dict) and obj.get("snapshot_hash"):
                  found = obj

          if found is None:
              raise SystemExit(
                  "ERROR: flutterdec did not return snapshot_hash"
              )

          Path("work/info.json").write_text(
              json.dumps(found, indent=2)
          )

          Path("work/snapshot_hash").write_text(
              found["snapshot_hash"]
          )

          print(json.dumps(found, indent=2))
          PY

          HASH="$(cat work/snapshot_hash)"

          echo "Detected snapshot: $HASH"

          test "$HASH" = "78da37fed6bf1489361a312568249f3f"

          echo "SNAPSHOT_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Install Flutter AOT adapter
        shell: bash
        env:
          FLUTTERDEC_ADAPTER_STORE: ${{ github.workspace }}/work/adapter-store
        run: |
          set -e

          mkdir -p "$FLUTTERDEC_ADAPTER_STORE"

          nix run github:caverav/flutterdec -- \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            > work/adapter-install.raw \
            2> work/adapter-install.stderr

          cat work/adapter-install.stderr || true
          cat work/adapter-install.raw || true

          nix run github:caverav/flutterdec -- \
            adapter list --json \
            > work/adapter-list.raw \
            2> work/adapter-list.stderr

          cat work/adapter-list.stderr || true
          cat work/adapter-list.raw

      - name: Decompile Flutter AOT
        shell: bash
        env:
          FLUTTERDEC_ADAPTER_STORE: ${{ github.workspace }}/work/adapter-store
        run: |
          set +e

          nix run github:caverav/flutterdec -- \
            decompile work/native/libapp.so \
            -o work/decompile \
            --emit-asm \
            --emit-ir \
            --function-scope all \
            > work/decompile.raw \
            2> work/decompile.stderr

          RC=$?

          set -e

          cat work/decompile.stderr || true

          echo "Decompile exit code: $RC"

          find work/decompile -type f -print || true

          if find work/decompile -type f -print -quit | grep -q .; then
            exit 0
          fi

          exit "$RC"

      - name: Find FlashFy painter code
        shell: bash
        run: |
          set -e

          mkdir -p work/focused

          strings -t x work/native/libapp.so \
            | grep -E \
            '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|isFlashOn|FlashfyScreen|_FlashfyScreenState' \
            > work/focused/painter-strings.txt || true

          grep -RniE \
            '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|isFlashOn' \
            work/decompile \
            > work/focused/painter-code.txt || true

          cat work/focused/painter-strings.txt || true
          cat work/focused/painter-code.txt || true

      - name: Create report
        shell: bash
        run: |
          {
            echo "FlashFy Flutter AOT Analysis"
            echo
            echo "Snapshot hash:"
            cat work/snapshot_hash
            echo
            echo "Painter strings:"
            cat work/focused/painter-strings.txt || true
            echo
            echo "Painter code:"
            cat work/focused/painter-code.txt || true
          } > REPORT.txt

          cat REPORT.txt

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-analysis
          if-no-files-found: error
          path: |
            REPORT.txt
            work/info.json
            work/info.raw
            work/info.stderr
            work/snapshot_hash
            work/adapter-install.raw
            work/adapter-install.stderr
            work/adapter-list.raw
            work/adapter-list.stderr
            work/native/libapp.so
            work/decompile.raw
            work/decompile.stderr
            work/decompile/**
            work/focused/**
