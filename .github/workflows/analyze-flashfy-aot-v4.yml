name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check input
        shell: bash
        run: |
          set -e

          test -f split_config.arm64_v8a.apk

          mkdir -p work/native
          mkdir -p work/flutterdec

          echo "Input APK found."

      - name: Extract libapp.so
        shell: bash
        run: |
          set -e

          unzip -p \
            split_config.arm64_v8a.apk \
            lib/arm64-v8a/libapp.so \
            > work/native/libapp.so

          test -s work/native/libapp.so

          echo "libapp.so:"
          ls -lh work/native/libapp.so

      - name: Download flutterdec release
        shell: bash
        run: |
          set -e

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-${VERSION}-Linux-X64.tar.gz"

          echo "Downloading:"
          echo "$URL"

          curl -fL \
            "$URL" \
            -o work/flutterdec.tar.gz

          test -s work/flutterdec.tar.gz

          tar -xzf \
            work/flutterdec.tar.gz \
            -C work/flutterdec

          echo
          echo "flutterdec files:"
          find work/flutterdec -maxdepth 4 -type f -print

      - name: Locate flutterdec
        shell: bash
        run: |
          set -e

          BIN="$(find work/flutterdec -type f -path '*/bin/flutterdec' | head -1)"

          if [ -z "$BIN" ]; then
            echo "ERROR: flutterdec binary not found."
            find work/flutterdec -type f -print
            exit 1
          fi

          chmod +x "$BIN"

          echo "FLUTTERDEC_BIN=$PWD/$BIN" >> "$GITHUB_ENV"

          echo "Flutterdec:"
          "$PWD/$BIN" --version

      - name: Detect AOT snapshot
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "Flutterdec info"
          echo "======================================"

          "$FLUTTERDEC_BIN" \
            info \
            work/native/libapp.so \
            --json \
            > work/info.raw \
            2> work/info.stderr

          RC=$?

          set -e

          echo "flutterdec exit code: $RC"

          echo
          echo "========== STDOUT =========="
          cat work/info.raw || true

          echo
          echo "========== STDERR =========="
          cat work/info.stderr || true

          echo
          echo "======================================"
          echo "Extracting snapshot hash"
          echo "======================================"

          HASH="$(
            grep -oE \
              '"snapshot_hash"[[:space:]]*:[[:space:]]*"[^"]+"' \
              work/info.raw \
              | head -1 \
              | sed -E \
              's/.*"snapshot_hash"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
          )"

          if [ -z "$HASH" ]; then
            HASH="$(
              grep -oE \
                '"snapshot_hash"[[:space:]]*:[[:space:]]*"[^"]+"' \
                work/info.stderr \
                | head -1 \
                | sed -E \
                's/.*"snapshot_hash"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
            )"
          fi

          echo
          echo "Detected snapshot hash: $HASH"

          if [ -z "$HASH" ]; then
            echo
            echo "ERROR: Could not detect snapshot hash."
            echo
            echo "Raw output:"
            cat work/info.raw || true
            echo
            echo "Error output:"
            cat work/info.stderr || true
            exit 1
          fi

          echo "$HASH" > work/snapshot_hash

          echo
          echo "Detected:"
          cat work/snapshot_hash

          echo
          echo "Expected:"
          echo "78da37fed6bf1489361a312568249f3f"

          if [ "$HASH" != "78da37fed6bf1489361a312568249f3f" ]; then
            echo
            echo "ERROR: Snapshot hash does not match FlashFy."
            exit 1
          fi

          echo "SNAPSHOT_HASH=$HASH" >> "$GITHUB_ENV"

          echo
          echo "Snapshot hash confirmed."

      - name: Install AOT adapter
        shell: bash
        env:
          FLUTTERDEC_ADAPTER_STORE: ${{ github.workspace }}/work/adapter-store
        run: |
          set -e

          mkdir -p "$FLUTTERDEC_ADAPTER_STORE"

          echo "======================================"
          echo "Installing adapter"
          echo "======================================"

          "$FLUTTERDEC_BIN" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            > work/adapter-install.raw \
            2> work/adapter-install.stderr

          echo
          echo "Adapter install output:"
          cat work/adapter-install.raw || true

          echo
          echo "Adapter install stderr:"
          cat work/adapter-install.stderr || true

          echo
          echo "======================================"
          echo "Adapter list"
          echo "======================================"

          "$FLUTTERDEC_BIN" \
            adapter list \
            --json \
            > work/adapter-list.raw \
            2> work/adapter-list.stderr || true

          cat work/adapter-list.raw || true
          cat work/adapter-list.stderr || true

      - name: Decompile AOT
        shell: bash
        env:
          FLUTTERDEC_ADAPTER_STORE: ${{ github.workspace }}/work/adapter-store
        run: |
          set +e

          mkdir -p work/decompile

          echo "======================================"
          echo "Decompiling FlashFy"
          echo "======================================"

          "$FLUTTERDEC_BIN" \
            decompile \
            work/native/libapp.so \
            -o work/decompile \
            --emit-asm \
            --emit-ir \
            --function-scope all \
            > work/decompile.raw \
            2> work/decompile.stderr

          RC=$?

          set -e

          echo
          echo "Decompile exit code: $RC"

          echo
          echo "========== STDERR =========="
          cat work/decompile.stderr || true

          echo
          echo "========== STDOUT =========="
          cat work/decompile.raw || true

          echo
          echo "========== FILES =========="
