name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check APK inputs
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do
            test -f "$f" || {
              echo "Missing: $f"
              exit 1
            }
          done

          echo "All APK inputs found."

      - name: Extract libapp.so directly
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/native

          unzip -p \
            split_config.arm64_v8a.apk \
            lib/arm64-v8a/libapp.so \
            > work/native/libapp.so

          test -s work/native/libapp.so

          echo "libapp.so extracted:"
          ls -lh work/native/libapp.so

      - name: Extract Flutter assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/assets

          unzip -l base.apk \
            | grep 'assets/flutter_assets/' \
            | tee work/assets/list.txt || true

          unzip -p base.apk \
            assets/flutter_assets/AssetManifest.bin \
            > work/assets/AssetManifest.bin || true

          unzip -p base.apk \
            assets/flutter_assets/assets/flash_on.png \
            > work/assets/flash_on.png || true

          unzip -p base.apk \
            assets/flutter_assets/assets/flash_off.png \
            > work/assets/flash_off.png || true

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect AOT snapshot
        shell: bash
        run: |
          set -euo pipefail

          nix run github:caverav/flutterdec -- \
            info work/native/libapp.so --json \
            | tee work/info.json

          HASH="$(python3 - <<'PY'
          import json

          with open("work/info.json", encoding="utf-8") as f:
              x = json.load(f)

          print(x["snapshot_hash"])
          PY
          )"

          DART="$(python3 - <<'PY'
          import json

          with open("work/info.json", encoding="utf-8") as f:
              x = json.load(f)

          print(x.get("dart_version", "unknown"))
          PY
          )"

          echo "Snapshot: $HASH"
          echo "Dart: $DART"

          echo "SNAPSHOT_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Verify FlashFy snapshot
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="78da37fed6bf1489361a312568249f3f"

          if [ "$SNAPSHOT_HASH" != "$EXPECTED" ]; then
            echo "Unexpected snapshot hash."
            echo "Expected: $EXPECTED"
            echo "Actual:   $SNAPSHOT_HASH"
            exit 1
          fi

          echo "Correct FlashFy AOT snapshot confirmed."

      - name: Install matching adapter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/adapter-store

          export FLUTTERDEC_ADAPTER_STORE="$GITHUB_WORKSPACE/work/adapter-store"

          nix run github:caverav/flutterdec -- \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            | tee work/adapter-install.json

          nix run github:caverav/flutterdec -- \
            adapter list --json \
            | tee work/adapter-list.json

          echo
          cat work/adapter-list.json

