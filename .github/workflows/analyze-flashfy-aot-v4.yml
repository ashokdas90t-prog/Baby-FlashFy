name: analyze-aot

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSPECT REPOSITORY
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 5 -type f | sort | head -1000

      # ============================================================
      # 3. LOCATE APK FILES
      # ============================================================
      - name: Locate APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          find . \
            -type f \
            -iname "*.apk" \
            -print \
            | sort \
            | tee work/apk-list.txt

          if ! grep -q "\.apk$" work/apk-list.txt; then
            echo "ERROR: No APK found."
            exit 1
          fi

      # ============================================================
      # 4. EXTRACT ARM64 LIBAPP.SO
      # ============================================================
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/apk-unpacked

          FOUND=""

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"
            OUT="work/apk-unpacked/$NAME"

            rm -rf "$OUT"
            mkdir -p "$OUT"

            echo
            echo "Checking:"
            echo "$APK"

            unzip -q "$APK" -d "$OUT"

            LIBAPP="$(
              find "$OUT" \
                -type f \
                -path "*/lib/arm64-v8a/libapp.so" \
                | head -n 1
            )"

            if [ -n "$LIBAPP" ]; then

              echo
              echo "FOUND:"
              echo "$LIBAPP"

              cp "$LIBAPP" work/libapp.so

              echo "$APK" \
                > work/libapp-source.txt

              FOUND="yes"
              break

            fi

          done < work/apk-list.txt

          if [ -z "$FOUND" ]; then
            echo "ERROR: ARM64 libapp.so not found."
            exit 1
          fi

          echo
          file work/libapp.so

          echo
          ls -lh work/libapp.so

          sha256sum work/libapp.so \
            | tee work/libapp.sha256

      # ============================================================
      # 5. DOWNLOAD FLUTTERDEC ALPHA.4
      # ============================================================
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          rm -rf work/flutterdec

          mkdir -p work/flutterdec

          echo
          echo "============================================================"
          echo "DOWNLOADING FLUTTERDEC"
          echo "============================================================"

          echo "URL:"
          echo "$URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o work/flutterdec/flutterdec.tar.gz

          echo
          echo "============================================================"
          echo "ARCHIVE CONTENTS"
          echo "============================================================"

          tar \
            -tzf \
            work/flutterdec/flutterdec.tar.gz

          rm -rf work/flutterdec/extracted

          mkdir -p work/flutterdec/extracted

          tar \
            -xzf \
            work/flutterdec/flutterdec.tar.gz \
            -C \
            work/flutterdec/extracted

          echo
          echo "============================================================"
          echo "EXTRACTED FILES"
          echo "============================================================"

          find work/flutterdec/extracted \
            -type f \
            -printf "%p\n" \
            | sort

          # --------------------------------------------------------
          # Find executable.
          # Official release layout:
          #
          #   bin/flutterdec
          #   share/flutterdec/
          #
          # --------------------------------------------------------

          BIN="$(
            find work/flutterdec/extracted \
              -type f \
              -path "*/bin/flutterdec" \
              | head -n 1
          )"

          # Fallback for a flat distribution.
          if [ -z "$BIN" ]; then
            BIN="$(
              find work/flutterdec/extracted \
                -type f \
                -name "flutterdec" \
                | head -n 1
            )"
          fi

          if [ -z "$BIN" ]; then
            echo
            echo "ERROR: Flutterdec executable not found."
            exit 1
          fi

          echo
          echo "Flutterdec executable:"
          echo "$BIN"

          # --------------------------------------------------------
          # Find compatibility registry.
          # This proves that the packaged Flutterdec data exists.
          # --------------------------------------------------------

          REGISTRY="$(
            find work/flutterdec/extracted \
              -type f \
              -path "*/share/flutterdec/adapters/registry.json" \
              | head -n 1
          )"

          # Fallback for flat unpacked distribution.
          if [ -z "$REGISTRY" ]; then
            REGISTRY="$(
              find work/flutterdec/extracted \
                -type f \
                -path "*/adapters/registry.json" \
                | head -n 1
            )"
          fi

          if [ -z "$REGISTRY" ]; then
            echo
            echo "ERROR: Flutterdec compatibility registry not found."
            echo
            echo "The release archive must contain:"
            echo "  share/flutterdec/adapters/registry.json"
            echo
            exit 1
          fi

          echo
          echo "Compatibility registry:"
          echo "$REGISTRY"

          # --------------------------------------------------------
          # Derive the Flutterdec data directory from registry path.
          #
          # /prefix/share/flutterdec/adapters/registry.json
          #                         ^^^^^^^^^^^^^^^
          # DATA_DIR = /prefix/share/flutterdec
          # --------------------------------------------------------

          DATA_DIR="$(
            dirname \
              "$(dirname "$REGISTRY")"
          )"

          echo
          echo "Flutterdec data directory:"
          echo "$DATA_DIR"

          echo
          echo "Registry check:"
          test -f \
            "$DATA_DIR/adapters/registry.json"

          echo "OK"

          # --------------------------------------------------------
          # Use the executable and data directly from the extracted
          # release prefix. Do not separate the binary from share/.
          # --------------------------------------------------------

          echo "FLUTTERDEC=$BIN" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=$DATA_DIR" \
            >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo "FLUTTERDEC VERSION"
          echo "============================================================"

          "$BIN" \
            --version

      # ============================================================
      # 6. PREPARE FLUTTERDEC ADAPTER STORE
      # ============================================================
      - name: Prepare Flutterdec adapter store
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/work/flutterdec-adapters"

          mkdir -p \
            "$GITHUB_WORKSPACE/work/xdg-data"

          echo "FLUTTERDEC_ADAPTER_STORE=$GITHUB_WORKSPACE/work/flutterdec-adapters" \
            >> "$GITHUB_ENV"

          echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/work/xdg-data" \
            >> "$GITHUB_ENV"

          echo
          echo "Adapter store:"
          echo "$GITHUB_WORKSPACE/work/flutterdec-adapters"

      # ============================================================
      # 7. FLUTTERDEC INFO
      # ============================================================
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          mkdir -p work/info

          echo
          echo "============================================================"
          echo "FLUTTERDEC INFO"
          echo "============================================================"

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info.json \
            2> work/info/info.stderr

          STATUS=$?

          echo
          echo "Flutterdec info exit code:"
          echo "$STATUS"

          echo
          echo "INFO JSON:"
          cat work/info/info.json || true

          echo
          echo "INFO STDERR:"
          cat work/info/info.stderr || true

          exit 0

      # ============================================================
      # 8. DETECT DART SNAPSHOT HASH
      # ============================================================
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set -euo pipefail

          HASH=""

          if [ -s work/info/info.json ]; then

            HASH="$(
              python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/info.json")

          try:
              data = json.loads(
                  p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )
          except Exception as exc:
              print(
                  f"Could not parse info.json: {exc}",
                  flush=True
              )
              raise SystemExit(0)

          value = data.get("snapshot_hash")

          if isinstance(value, str):
              value = value.strip().lower()

              if len(value) == 32:
                  print(value)
          PY
            )"

          fi

          if [ -z "$HASH" ]; then
            echo
            echo "ERROR: snapshot_hash was not found."

            echo
            echo "Flutterdec info:"
            cat work/info/info.json || true

            echo
            echo "Flutterdec stderr:"
            cat work/info/info.stderr || true

            exit 1
          fi

          echo
          echo "============================================================"
          echo "DART SNAPSHOT HASH"
          echo "============================================================"

          echo "$HASH"

          echo "$HASH" \
            > work/snapshot-hash.txt

          echo "SNAPSHOT_HASH=$HASH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 9. CHECK ADAPTER REGISTRY BEFORE INSTALL
      # ============================================================
      - name: Check matching adapter registry
        shell: bash
        run: |
          set +e

          mkdir -p work/adapter

          echo
          echo "============================================================"
          echo "ADAPTER REGISTRY CHECK"
          echo "============================================================"

          echo "Snapshot:"
          echo "$SNAPSHOT_HASH"

          echo
          echo "Flutterdec data directory:"
          echo "$FLUTTERDEC_DATA_DIR"

          echo
          echo "Registry:"
          ls -lh \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json"

          echo
          echo "Searching registry for snapshot hash..."

          grep -ni \
            "$SNAPSHOT_HASH" \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json" \
            > work/adapter/registry-match.txt \
            2>&1

          STATUS=$?

          echo
          echo "Registry search exit code:"
          echo "$STATUS"

          cat work/adapter/registry-match.txt \
            || true

          echo
          echo "Adapter list BEFORE install:"

          "$FLUTTERDEC" \
            adapter list \
            --json \
            > work/adapter/list-before.json \
            2>&1

          LIST_STATUS=$?

          echo
          echo "Adapter list exit code:"
          echo "$LIST_STATUS"

          cat work/adapter/list-before.json \
            || true

          # Do not stop here.
          # The install step below will provide the authoritative error.
          exit 0

      # ============================================================
      # 10. INSTALL MATCHING FLUTTERDEC ADAPTER
      # ============================================================
      - name: Install matching Flutterdec adapter
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "INSTALLING ADAPTER"
          echo "============================================================"

          echo "Snapshot:"
          echo "$SNAPSHOT_HASH"

          rm -rf work/adapter/install.json
          rm -f work/adapter/install.txt

          "$FLUTTERDEC" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            > work/adapter/install.json \
            2> work/adapter/install.txt

          STATUS=$?

          echo
          echo "Adapter install exit code:"
          echo "$STATUS"

          echo
          echo "Adapter install stdout:"
          cat work/adapter/install.json \
            || true

          echo
          echo "Adapter install stderr:"
          cat work/adapter/install.txt \
            || true

          echo
          echo "============================================================"
          echo "ADAPTER LIST AFTER INSTALL"
          echo "============================================================"

          "$FLUTTERDEC" \
            adapter list \
            --json \
            > work/adapter/list-after.json \
            2>&1

          LIST_STATUS=$?

          echo
          echo "Adapter list exit code:"
          echo "$LIST_STATUS"

          cat work/adapter/list-after.json \
            || true

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "ERROR: Adapter installation failed."
            echo
            echo "The exact Flutterdec error has been saved to:"
            echo "work/adapter/install.txt"
            echo "work/adapter/install.json"
            echo "work/adapter/list-after.json"

            exit "$STATUS"
          fi

      # ============================================================
      # 11. VERIFY ADAPTER WITH FLUTTERDEC INFO
      # ============================================================
      - name: Verify adapter with Flutterdec info
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "INFO AFTER ADAPTER"
          echo "============================================================"

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info-after-adapter.json \
            2> work/info/info-after-adapter.stderr

          STATUS=$?

          echo
          echo "Info exit code:"
          echo "$STATUS"

          echo
          echo "INFO AFTER ADAPTER:"
          cat work/info/info-after-adapter.json \
            || true

          echo
          echo "STDERR:"
          cat work/info/info-after-adapter.stderr \
            || true

          exit 0

      # ============================================================
      # 12. DECOMPILE FLUTTER AOT
      # ============================================================
      - name: Decompile Flutter AOT
        shell: bash
        run: |
          set +e

          rm -rf work/flutterdec-out

          mkdir -p work/flutterdec-out

          echo
          echo "============================================================"
          echo "DECOMPILING LIBAPP.SO"
          echo "============================================================"

          "$FLUTTERDEC" \
            decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --emit-ghidra-script \
            --emit-ida-script \
            --function-scope all \
            > work/flutterdec-out/decompile.log \
            2>&1

          STATUS=$?

          echo
          echo "Decompile exit code:"
          echo "$STATUS"

          echo
          echo "Decompile log:"
          cat work/flutterdec-out/decompile.log \
            || true

          echo
          echo "Generated files:"
          find work/flutterdec-out \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "$STATUS" \
            > work/flutterdec-out/exit-code.txt

          # Flutterdec may write useful artifacts even when
          # its final quality gate returns non-zero.
          exit 0

      # ============================================================
      # 13. INSPECT DECOMPILER OUTPUT
      # ============================================================
      - name: Inspect decompiler output
        shell: bash
        run: |
          set +e

          mkdir -p work/search

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|flashfy_screen.dart|flashfy_controller.dart|torch_service.dart"

          echo "============================================================" \
            > work/search/painter-search.txt

          echo "FLUTTERDEC OUTPUT" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          grep -RniE \
            "$PATTERN" \
            work/flutterdec-out \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          echo \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          echo "RAW STRINGS" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          strings \
            -a \
            -t x \
            work/libapp.so \
            | grep -Ei \
              "$PATTERN" \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          echo
          echo "Painter search:"
          cat work/search/painter-search.txt

      # ============================================================
      # 14. COLLECT RECOVERED PSEUDOCODE
      # ============================================================
      - name: Collect recovered pseudocode
        shell: bash
        run: |
          set +e

          mkdir -p work/recovered

          find work/flutterdec-out \
            -type f \
            \
              -name "*.dartpseudo" \
              -o \
              -name "*.dart" \
              -o \
              -name "*.txt" \
            \
            -print \
            | sort \
            > work/recovered/files.txt

          echo
          echo "Recovered source-like files:"
          cat work/recovered/files.txt

          echo
          echo "Searching recovered pseudocode..."

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            grep -niE \
              "_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn" \
              "$FILE" \
              2>/dev/null \
              && echo \
              || true

          done < work/recovered/files.txt \
            > work/recovered/matching-functions.txt

          echo
          echo "Matching recovered functions:"
          cat work/recovered/matching-functions.txt \
           
