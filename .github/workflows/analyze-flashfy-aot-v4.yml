name: analyze-flashfy-aot-v4

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Locate APK
      # ------------------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | sed -n '1,250p'

          APK="$(find . -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK file found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"

      # ------------------------------------------------------------
      # 3. Extract ARM64 libapp.so from split APK
      # ------------------------------------------------------------
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -e

          rm -rf work
          mkdir -p work/apk

          echo "Extracting APK..."
          unzip -q "$APK" -d work/apk

          echo "Searching for libapp.so..."

          LIBAPP="$(find work/apk -type f -path '*/lib/arm64-v8a/libapp.so' | head -n 1 || true)"

          if [ -z "$LIBAPP" ]; then
            echo "libapp.so was not found inside this APK."
            echo
            echo "Searching all files:"
            find work/apk -type f | grep -E 'libapp|arm64|apk' || true
            exit 1
          fi

          cp "$LIBAPP" work/libapp.so

          echo "Extracted:"
          ls -lh work/libapp.so

          file work/libapp.so

      # ------------------------------------------------------------
      # 4. Install Flutterdec alpha.4
      # ------------------------------------------------------------
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -e

          VERSION="v0.1.0-alpha.4"
          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          echo "Downloading:"
          echo "$URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/flutterdec.tar.gz \
            "$URL"

          mkdir -p /opt/flutterdec

          tar -xzf /tmp/flutterdec.tar.gz \
            -C /opt/flutterdec \
            --strip-components=1

          echo "Flutterdec installation:"
          find /opt/flutterdec -maxdepth 3 -type f | sort | sed -n '1,200p'

          test -x /opt/flutterdec/bin/flutterdec

          /opt/flutterdec/bin/flutterdec --version || true

          echo "FLUTTERDEC=/opt/flutterdec/bin/flutterdec" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 5. Flutterdec info
      # ------------------------------------------------------------
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          mkdir -p work/info

          "$FLUTTERDEC" info work/libapp.so --json \
            > work/info/flutterdec-info.json 2>&1

          STATUS=$?

          echo "flutterdec info exit code: $STATUS"
          cat work/info/flutterdec-info.json || true

          # Do not stop here. We want the diagnostic artifact even
          # when flutterdec returns a non-zero status.
          exit 0

      # ------------------------------------------------------------
      # 6. Detect Dart snapshot hash
      # ------------------------------------------------------------
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set +e

          INFO="work/info/flutterdec-info.json"

          echo "Searching snapshot hash..."

          HASH=""

          if [ -f "$INFO" ]; then
            HASH="$(grep -Eo '[0-9a-fA-F]{32,64}' "$INFO" | head -n 1 || true)"
          fi

          if [ -z "$HASH" ]; then
            echo "No hash found in JSON output."
            echo
            echo "Trying strings from libapp.so..."

            HASH="$(
              strings work/libapp.so |
              grep -Eio '[0-9a-f]{32,64}' |
              head -n 1 ||
              true
            )"
          fi

          if [ -z "$HASH" ]; then
            echo "WARNING: Snapshot hash could not be detected automatically."
            echo "SNAPSHOT_HASH=" >> "$GITHUB_ENV"
          else
            HASH="$(echo "$HASH" | tr '[:upper:]' '[:lower:]')"

            echo "Detected hash: $HASH"

            echo "SNAPSHOT_HASH=$HASH" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------
      # 7. Prepare writable adapter store
      # ------------------------------------------------------------
      - name: Prepare Flutterdec adapter store
        shell: bash
        run: |
          set -e

          mkdir -p work/flutterdec-adapters

          echo "FLUTTERDEC_ADAPTER_STORE=$GITHUB_WORKSPACE/work/flutterdec-adapters" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=/opt/flutterdec/share/flutterdec" \
            >> "$GITHUB_ENV"

          echo "Adapter store:"
          find work/flutterdec-adapters -maxdepth 3 -type f -print || true

      # ------------------------------------------------------------
      # 8. Install matching adapter
      # ------------------------------------------------------------
      - name: Install Flutterdec adapter
        shell: bash
        run: |
          set +e

          mkdir -p work/adapter

          if [ -z "${SNAPSHOT_HASH:-}" ]; then
            echo "Snapshot hash is empty."
            echo "Skipping automatic adapter installation."

            cat > work/adapter/adapter-status.txt <<'EOF'
          Snapshot hash was not detected automatically.
          Adapter installation was skipped.
          EOF

            exit 0
          fi

          echo "Installing adapter for:"
          echo "$SNAPSHOT_HASH"

          "$FLUTTERDEC" adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            > work/adapter/install.json 2>&1

          STATUS=$?

          echo "Adapter installation exit code: $STATUS"

          cat work/adapter/install.json || true

          "$FLUTTERDEC" adapter list \
            > work/adapter/list.txt 2>&1 || true

          echo
          echo "Installed adapters:"
          cat work/adapter/list.txt || true

          # Do not fail the complete diagnostic workflow here.
          exit 0

      # ------------------------------------------------------------
      # 9. Decompile with Flutterdec
      # ------------------------------------------------------------
      - name: Decompile Flutter AOT snapshot
        shell: bash
        run: |
          set +e

          mkdir -p work/flutterdec-out

          echo "Starting Flutterdec decompilation..."

          "$FLUTTERDEC" decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --function-scope all \
            > work/flutterdec-out/decompile.log 2>&1

          STATUS=$?

          echo "Flutterdec decompile exit code: $STATUS"

          cat work/flutterdec-out/decompile.log || true

          echo
          echo "Generated Flutterdec files:"
          find work/flutterdec-out \
            -maxdepth 5 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | sed -n '1,400p'

          # Flutterdec can return non-zero because of its quality gate
          # even when useful artifacts have already been generated.
          exit 0

      # ------------------------------------------------------------
      # 10. Install Python dependencies
      # ------------------------------------------------------------
      - name: Install analysis dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            capstone \
            pyelftools

      # ------------------------------------------------------------
      # 11. Clone AOTopsy
      # ------------------------------------------------------------
      - name: Clone AOTopsy
        shell: bash
        run: |
          set -e

          rm -rf work/aotopsy

          git clone \
            --depth 1 \
            https://github.com/BroNils/aotopsy.git \
            work/aotopsy

          echo "AOTopsy repository:"
          find work/aotopsy -maxdepth 3 -type f | sort | sed -n '1,300p'

      # ------------------------------------------------------------
      # 12. Install AOTopsy
      # ------------------------------------------------------------
      - name: Install AOTopsy
        shell: bash
        run: |
          set +e

          cd work/aotopsy

          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            python3 -m pip install .
          elif [ -f setup.py ]; then
            python3 -m pip install .
          fi

          echo "Installed AOTopsy."

          python3 -m aotopsy --help \
            > "$GITHUB_WORKSPACE/work/aotopsy-help.txt" 2>&1 || true

          cat "$GITHUB_WORKSPACE/work/aotopsy-help.txt" || true

          exit 0

      # ------------------------------------------------------------
      # 13. Run AOTopsy
      # ------------------------------------------------------------
      - name: Analyze libapp.so with AOTopsy
        shell: bash
        run: |
          set +e

          mkdir -p work/aotopsy-out

          echo "Trying AOTopsy module entrypoint..."

          python3 -m aotopsy \
            work/libapp.so \
            --output work/aotopsy-out \
            > work/aotopsy-out/run.log 2>&1

          STATUS=$?

          echo "AOTopsy module exit code: $STATUS"

          cat work/aotopsy-out/run.log || true

          echo
          echo "AOTopsy output:"
          find work/aotopsy-out \
            -maxdepth 5 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | sed -n '1,500p'

          # Do not fail the workflow if the current AOTopsy CLI
          # uses a different entrypoint.
          exit 0

      # ------------------------------------------------------------
      # 14. Extract important FlashFy painter symbols
      # ------------------------------------------------------------
      - name: Extract FlashFy painter symbols
        shell: bash
        run: |
          set -e

          mkdir -p work/symbols

          strings -a -t x work/libapp.so \
            > work/symbols/all-strings.txt

          grep -Ei \
            'FlashfyScreen|FlashfyController|_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|toggleFlash|isFlashOn|TorchService|torch_service.dart|flashfy_screen.dart|flashfy_controller.dart' \
            work/symbols/all-strings.txt \
            > work/symbols/flashfy-symbols.txt \
            || true

          echo "Important FlashFy strings:"
          cat work/symbols/flashfy-symbols.txt || true

      # ------------------------------------------------------------
      # 15. ELF information
      # ------------------------------------------------------------
      - name: Inspect ELF
        shell: bash
        run: |
          set +e

          mkdir -p work/elf

          file work/libapp.so \
            > work/elf/file.txt 2>&1

          readelf -h work/libapp.so \
            > work/elf/header.txt 2>&1

          readelf -S work/libapp.so \
            > work/elf/sections.txt 2>&1

          readelf -l work/libapp.so \
            > work/elf/program-headers.txt 2>&1

          readelf -s work/libapp.so \
            > work/elf/symbol-table.txt 2>&1

          echo "=== FILE ==="
          cat work/elf/file.txt || true

          echo
          echo "=== ELF HEADER ==="
          cat work/elf/header.txt || true

          echo
          echo "=== SECTIONS ==="
          cat work/elf/sections.txt || true

          echo
          echo "=== PROGRAM HEADERS ==="
          cat work/elf/program-headers.txt || true

          echo
          echo "=== SYMBOL TABLE ==="
          cat work/elf/symbol-table.txt || true

          exit 0

      # ------------------------------------------------------------
      # 16. ARM64 disassembly
      # ------------------------------------------------------------
      - name: Generate ARM64 disassembly
        shell: bash
        run: |
          set +e

          mkdir -p work/disassembly

          objdump \
            -d \
            -M no-aliases \
            work/libapp.so \
            > work/disassembly/libapp-objdump.txt 2>&1

          echo "Objdump generated."

          wc -l work/disassembly/libapp-objdump.txt || true

          exit 0

      # ------------------------------------------------------------
      # 17. Search all recovered artifacts for painter methods
      # ------------------------------------------------------------
      - name: Search recovered AOT artifacts
        shell: bash
        run: |
          set +e

          mkdir -p work/search

          PATTERN='_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn'

          echo "=== Flutterdec ===" \
            > work/search/painter-search.txt

          grep -RniE \
            "$PATTERN" \
            work/flutterdec-out \
            >> work/search/painter-search.txt \
            2>&1 || true

          echo \
            >> work/search/painter-search.txt

          echo "=== AOTopsy ===" \
            >> work/search/painter-search.txt

          grep -RniE \
            "$PATTERN" \
            work/aotopsy-out \
            >> work/search/painter-search.txt \
            2>&1 || true

          echo \
            >> work/search/painter-search.txt

          echo "=== Symbols ===" \
            >> work/search/painter-search.txt

          cat work/symbols/flashfy-symbols.txt \
            >> work/search/painter-search.txt \
            2>&1 || true

          cat work/search/painter-search.txt

      # ------------------------------------------------------------
      # 18. Search strings around known Flutter method names
      # ------------------------------------------------------------
      - name: Extract nearby string context
        shell: bash
        run: |
          set +e

          mkdir -p work/context

          python3 <<'PY'
          from pathlib import Path

          p = Path("work/symbols/all-strings.txt")
          out = Path("work/context/flutter-method-context.txt")

          if not p.exists():
              out.write_text("strings file missing\n")
              raise SystemExit(0)

          lines = p.read_text(errors="replace").splitlines()

          patterns = [
              "_RopeBulbPainter",
              "_drawBulb",
              "_drawPullRope",
              "_BackgroundPainter",
              "_paintBackgroundImage",
              "_paintBackgroundColor",
              "_drawImageScaledAndCentered",
              "_FlashfyScreenState",
              "FlashfyScreen",
              "FlashfyController",
              "toggleFlash",
              "isFlashOn",
              "TorchService",
              "torch_service.dart",
              "flashfy_screen.dart",
              "flashfy_controller.dart",
          ]

          result = []

          for i, line in enumerate(lines):
              if any(x in line for x in patterns):
                  start = max(0, i - 15)
                  end = min(len(lines), i + 16)

                  result.append(
                      f"\n===== MATCH AT LINE {i + 1} =====\n"
                  )

                  result.extend(lines[start:end])

          out.write_text(
              "\n".join(result),
              encoding="utf-8",
              errors="replace",
          )

          print(out.read_text(errors="replace")[:50000])
          PY

          exit 0

      # ------------------------------------------------------------
      # 19. Check embedded Flutter assets
      # ------------------------------------------------------------
      - name: Inspect Flutter assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets

          unzip -l "$APK" \
            > work/assets/apk-file-list.txt 2>&1

          grep -Ei \
            'flutter_assets|flash_on|flash_off|flashlight|icon|AssetManifest' \
            work/assets/apk-file-list.txt \
            > work/assets/flutter-assets.txt \
            || true

          echo "Flutter assets:"
          cat work/assets/flutter-assets.txt || true

          exit 0

      # ------------------------------------------------------------
      # 20. Extract asset images for reference
      # ------------------------------------------------------------
      - name: Extract Flutter image assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets/extracted

          unzip -j -o "$APK" \
            'assets/flutter_assets/assets/*' \
            -d work/assets/extracted \
            > work/assets/extract-assets.log 2>&1 || true

          find work/assets/extracted \
            -type f \
            -maxdepth 2 \
            -printf '%f %s bytes\n' \
            | sort \
            > work/assets/extracted-list.txt

          cat work/assets/extracted-list.txt || true

          exit 0

      # ------------------------------------------------------------
      # 21. Build a compact diagnostic summary
      # ------------------------------------------------------------
      - name: Create final diagnostic summary
        shell: bash
        run: |
          set +e

          mkdir -p work/final

          {
            echo "============================================================"
            echo "FlashFy Flutter AOT Analysis"
            echo "============================================================"
            echo
            echo "Repository:"
            echo "$GITHUB_REPOSITORY"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "APK:"
            echo "$APK"
            echo
            echo "Snapshot hash:"
            echo "${SNAPSHOT_HASH:-NOT DETECTED}"
            echo
            echo "============================================================"
            echo "FlashFy painter symbols"
            echo "============================================================"
            cat work/symbols/flashfy-symbols.txt 2>/dev/null || true
            echo
            echo "============================================================"
            echo "Painter search"
            echo "============================================================"
            cat work/search/painter-search.txt 2>/dev/null || true
            echo
            echo "============================================================"
            echo "Flutterdec decompile log"
            echo "============================================================"
            cat work/flutterdec-out/decompile.log 2>/dev/null || true
            echo
            echo "============================================================"
            echo "AOTopsy log"
            echo "============================================================"
            cat work/aotopsy-out/run.log 2>/dev/null || true
          } > work/final/FINAL-SUMMARY.txt

          cat work/final/FINAL-SUMMARY.txt

      # ------------------------------------------------------------
      # 22. Create ZIP of ALL diagnostics
      # ------------------------------------------------------------
      - name: Package diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          zip -r \
            artifacts/FlashFy-AOT-Diagnostics.zip \
            work \
            > /tmp/zip.log 2>&1

          echo "Diagnostic ZIP:"
          ls -lh artifacts/FlashFy-AOT-Diagnostics.zip

      # ------------------------------------------------------------
      # 23. Upload diagnostics
      # ------------------------------------------------------------
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Diagnostics
          path: artifacts/FlashFy-AOT-Diagnostics.zip
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 24. Upload raw analysis directory too
      # ------------------------------------------------------------
      - name: Upload raw analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Raw-Analysis
          path: work
          if-no-files-found: warn
          retention-days: 14
