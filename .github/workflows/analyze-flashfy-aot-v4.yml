name: analyze-aot

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSPECT REPOSITORY
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Repository"
          echo "============================================================"

          pwd

          echo
          echo "Files:"
          find . -maxdepth 5 -type f | sort | sed -n '1,500p'

      # ============================================================
      # 3. LOCATE APK
      # ============================================================
      - name: Locate APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          find . \
            -type f \
            -iname "*.apk" \
            -print \
            | sort \
            | tee work/apk-list.txt

          if ! grep -q "\.apk$" work/apk-list.txt; then
            echo "ERROR: No APK files found."
            exit 1
          fi

          echo
          echo "APK files found:"
          cat work/apk-list.txt

      # ============================================================
      # 4. EXTRACT ARM64 LIBAPP.SO
      # ============================================================
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/apk-unpacked

          FOUND=""

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"
            OUT="work/apk-unpacked/$NAME"

            echo
            echo "============================================================"
            echo "Checking:"
            echo "$APK"
            echo "============================================================"

            rm -rf "$OUT"
            mkdir -p "$OUT"

            unzip -q "$APK" -d "$OUT"

            LIBAPP="$(
              find "$OUT" \
                -type f \
                -path "*/lib/arm64-v8a/libapp.so" \
                | head -n 1
            )"

            if [ -n "$LIBAPP" ]; then

              echo "FOUND:"
              echo "$LIBAPP"

              cp "$LIBAPP" work/libapp.so
              echo "$APK" > work/libapp-source.txt

              FOUND="yes"
              break
            fi

          done < work/apk-list.txt

          if [ -z "$FOUND" ]; then
            echo
            echo "ERROR: ARM64 libapp.so not found."
            exit 1
          fi

          echo
          echo "libapp.so:"
          ls -lh work/libapp.so

          echo
          file work/libapp.so

          sha256sum work/libapp.so \
            | tee work/libapp.sha256

      # ============================================================
      # 5. DOWNLOAD FLUTTERDEC ALPHA.4
      #
      # IMPORTANT:
      # The actual archive contains:
      #
      #     flutterdec
      #
      # NOT:
      #
      #     bin/flutterdec
      #
      # ============================================================
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          echo "Downloading Flutterdec:"
          echo "$URL"

          mkdir -p work/flutterdec-download

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o work/flutterdec-download/flutterdec.tar.gz

          echo
          echo "============================================================"
          echo "Archive contents"
          echo "============================================================"

          tar -tzf \
            work/flutterdec-download/flutterdec.tar.gz

          rm -rf work/flutterdec-extracted
          mkdir -p work/flutterdec-extracted

          tar \
            -xzf \
            work/flutterdec-download/flutterdec.tar.gz \
            -C \
            work/flutterdec-extracted

          echo
          echo "============================================================"
          echo "Extracted files"
          echo "============================================================"

          find work/flutterdec-extracted \
            -type f \
            -printf "%p %s bytes\n"

          # --------------------------------------------------------
          # THE IMPORTANT FIX
          # --------------------------------------------------------

          FLUTTERDEC_BIN="$(
            find work/flutterdec-extracted \
              -type f \
              -name "flutterdec" \
              | head -n 1
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            echo
            echo "ERROR: flutterdec executable not found."
            exit 1
          fi

          echo
          echo "Flutterdec executable:"
          echo "$FLUTTERDEC_BIN"

          mkdir -p /opt/flutterdec

          cp \
            "$FLUTTERDEC_BIN" \
            /opt/flutterdec/flutterdec

          chmod +x \
            /opt/flutterdec/flutterdec

          echo "FLUTTERDEC=/opt/flutterdec/flutterdec" \
            >> "$GITHUB_ENV"

          echo
          echo "Installed Flutterdec:"
          ls -lh /opt/flutterdec/flutterdec

          echo
          echo "File:"
          file /opt/flutterdec/flutterdec

          echo
          echo "Version:"
          /opt/flutterdec/flutterdec --version

      # ============================================================
      # 6. CHECK FLUTTERDEC
      # ============================================================
      - name: Verify Flutterdec
        shell: bash
        run: |
          set -euo pipefail

          echo "FLUTTERDEC:"
          echo "$FLUTTERDEC"

          test -x "$FLUTTERDEC"

          echo
          echo "Flutterdec version:"
          "$FLUTTERDEC" --version

      # ============================================================
      # 7. GET FLUTTERDEC ALPHA.4 SOURCE
      # ============================================================
      - name: Checkout Flutterdec alpha.4 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/flutterdec-src

          git clone \
            --depth 1 \
            --branch v0.1.0-alpha.4 \
            https://github.com/caverav/flutterdec.git \
            work/flutterdec-src

          cd work/flutterdec-src

          echo
          echo "Flutterdec commit:"
          git rev-parse HEAD

          echo
          echo "Flutterdec source:"
          find . \
            -maxdepth 4 \
            -type f \
            | sort \
            | sed -n '1,600p'

      # ============================================================
      # 8. PREPARE WORK DIRECTORIES
      # ============================================================
      - name: Prepare analysis directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/info
          mkdir -p work/adapter
          mkdir -p work/flutterdec-out
          mkdir -p work/aotopsy
          mkdir -p work/symbols
          mkdir -p work/elf
          mkdir -p work/disassembly
          mkdir -p work/assets
          mkdir -p work/search

      # ============================================================
      # 9. FLUTTERDEC INFO
      # ============================================================
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          echo "Running Flutterdec info..."

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info.json \
            2> work/info/info.stderr

          STATUS=$?

          echo
          echo "Exit code:"
          echo "$STATUS"

          echo
          echo "STDOUT:"
          cat work/info/info.json || true

          echo
          echo "STDERR:"
          cat work/info/info.stderr || true

          # Do not stop the workflow here.
          exit 0

      # ============================================================
      # 10. DETECT DART SNAPSHOT HASH
      # ============================================================
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set +e

          python3 <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/info.json")

          if not p.exists() or p.stat().st_size == 0:
              print("No Flutterdec JSON output.")
              raise SystemExit(0)

          try:
              data = json.loads(
                  p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )
          except Exception as e:
              print("Could not parse JSON:", e)
              raise SystemExit(0)

          print("Flutterdec info:")
          print(json.dumps(data, indent=2))

          candidates = [
              data.get("snapshot_hash"),
              data.get("dart_snapshot_hash"),
              data.get("snapshotHash"),
              data.get("dartHash"),
          ]

          hash_value = None

          for value in candidates:
              if isinstance(value, str):
                  value = value.strip()

                  if len(value) == 32:
                      hash_value = value
                      break

          if hash_value:
              print()
              print("Dart snapshot hash:")
              print(hash_value)

              Path("work/snapshot-hash.txt").write_text(
                  hash_value + "\n"
              )
          else:
              print()
              print("Snapshot hash was not detected.")

          PY

          if [ -f work/snapshot-hash.txt ]; then

            SNAPSHOT_HASH="$(cat work/snapshot-hash.txt)"

            echo "SNAPSHOT_HASH=$SNAPSHOT_HASH" \
              >> "$GITHUB_ENV"

            echo
            echo "Detected:"
            echo "$SNAPSHOT_HASH"

          else

            echo "SNAPSHOT_HASH=" \
              >> "$GITHUB_ENV"

          fi

          exit 0

      # ============================================================
      # 11. ADAPTER INSTALL
      #
      # This is attempted, but failure will NOT kill the workflow.
      # ============================================================
      - name: Install matching Flutterdec adapter
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "Flutterdec adapter installation"
          echo "============================================================"

          if [ -z "${SNAPSHOT_HASH:-}" ]; then

            echo "No snapshot hash detected."
            echo "Skipping adapter installation."

            echo "SKIPPED" \
              > work/adapter/status.txt

            exit 0
          fi

          echo "Snapshot hash:"
          echo "$SNAPSHOT_HASH"

          "$FLUTTERDEC" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            > work/adapter/install.json \
            2>&1

          STATUS=$?

          echo
          echo "Adapter install exit code:"
          echo "$STATUS"

          echo
          echo "Adapter installation output:"
          cat work/adapter/install.json \
            || true

          echo
          echo "Adapter list:"

          "$FLUTTERDEC" \
            adapter list \
            > work/adapter/list.txt \
            2>&1

          cat work/adapter/list.txt \
            || true

          echo
          echo "$STATUS" \
            > work/adapter/exit-code.txt

          # IMPORTANT:
          # Do not fail workflow here.
          exit 0

      # ============================================================
      # 12. DECOMPILE WITH FLUTTERDEC
      # ============================================================
      - name: Decompile Flutter AOT
        shell: bash
        run: |
          set +e

          rm -rf work/flutterdec-out
          mkdir -p work/flutterdec-out

          echo "============================================================"
          echo "Flutterdec decompile"
          echo "============================================================"

          "$FLUTTERDEC" \
            decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --function-scope all \
            > work/flutterdec-out/decompile.log \
            2>&1

          STATUS=$?

          echo
          echo "Flutterdec exit code:"
          echo "$STATUS"

          echo
          echo "Decompile log:"
          cat work/flutterdec-out/decompile.log \
            || true

          echo
          echo "Generated files:"

          find work/flutterdec-out \
            -type f \
            -printf "%p %s bytes\n" \
            | sort \
            | sed -n '1,1000p'

          echo
          echo "$STATUS" \
            > work/flutterdec-out/exit-code.txt

          # Flutterdec can return non-zero after producing useful output.
          exit 0

      # ============================================================
      # 13. PYTHON TOOLS
      # ============================================================
      - name: Install Python analysis tools
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            capstone \
            pyelftools

      # ============================================================
      # 14. CLONE AOTOPSY
      # ============================================================
      - name: Clone AOTopsy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/aotopsy

          git clone \
            --depth 1 \
            https://github.com/BroNils/aotopsy.git \
            work/aotopsy

          echo
          echo "AOTopsy:"
          find work/aotopsy \
            -maxdepth 4 \
            -type f \
            | sort \
            | sed -n '1,600p'

      # ============================================================
      # 15. INSTALL AOTOPSY
      # ============================================================
      - name: Install AOTopsy
        shell: bash
        run: |
          set +e

          cd work/aotopsy

          if [ -f requirements.txt ]; then
            python3 -m pip install \
              -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            python3 -m pip install .
          elif [ -f setup.py ]; then
            python3 -m pip install .
          fi

          echo
          echo "Testing AOTopsy..."

          python3 -m aotopsy \
            --help \
            > "$GITHUB_WORKSPACE/work/aotopsy-help.txt" \
            2>&1

          STATUS=$?

          echo "AOTopsy help exit code:"
          echo "$STATUS"

          cat "$GITHUB_WORKSPACE/work/aotopsy-help.txt" \
            || true

          exit 0

      # ============================================================
      # 16. RUN AOTOPSY
      # ============================================================
      - name: Analyze libapp.so with AOTopsy
        shell: bash
        run: |
          set +e

          mkdir -p work/aotopsy-out

          echo "Running AOTopsy..."

          python3 -m aotopsy \
            work/libapp.so \
            --output work/aotopsy-out \
            > work/aotopsy-out/run.log \
            2>&1

          STATUS=$?

          echo
          echo "AOTopsy exit code:"
          echo "$STATUS"

          echo
          echo "AOTopsy log:"
          cat work/aotopsy-out/run.log \
            || true

          echo
          echo "AOTopsy output:"
          find work/aotopsy-out \
            -type f \
            -printf "%p %s bytes\n" \
            | sort \
            | sed -n '1,1000p'

          exit 0

      # ============================================================
      # 17. EXTRACT FLASHFY SYMBOLS
      # ============================================================
      - name: Extract FlashFy painter symbols
        shell: bash
        run: |
          set -euo pipefail

          strings \
            -a \
            -t x \
            work/libapp.so \
            > work/symbols/all-strings.txt

          grep -Ei \
            "_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|torch_service.dart|flashfy_screen.dart|flashfy_controller.dart" \
            work/symbols/all-strings.txt \
            > work/symbols/flashfy-symbols.txt \
            || true

          echo
          echo "============================================================"
          echo "FlashFy painter symbols"
          echo "============================================================"

          cat work/symbols/flashfy-symbols.txt \
            || true

      # ============================================================
      # 18. SEARCH DECOMPILER OUTPUT
      # ============================================================
      - name: Search recovered painter functions
        shell: bash
        run: |
          set +e

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|torch_service.dart|flashfy_screen.dart|flashfy_controller.dart"

          {
            echo "============================================================"
            echo "Flutterdec output"
            echo "============================================================"

            grep -RniE \
              "$PATTERN" \
              work/flutterdec-out \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "AOTopsy output"
            echo "============================================================"

            grep -RniE \
              "$PATTERN" \
              work/aotopsy-out \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Raw strings"
            echo "============================================================"

            cat work/symbols/flashfy-symbols.txt \
              2>/dev/null \
              || true

          } > work/search/painter-search.txt

          cat work/search/painter-search.txt

          exit 0

      # ============================================================
      # 19. ELF INFORMATION
      # ============================================================
      - name: Inspect ELF
        shell: bash
        run: |
          set +e

          file work/libapp.so \
            > work/elf/file.txt \
            2>&1

          readelf -h work/libapp.so \
            > work/elf/header.txt \
            2>&1

          readelf -S work/libapp.so \
            > work/elf/sections.txt \
            2>&1

          readelf -l work/libapp.so \
            > work/elf/program-headers.txt \
            2>&1

          echo "=== FILE ==="
          cat work/elf/file.txt || true

          echo
          echo "=== ELF HEADER ==="
          cat work/elf/header.txt || true

          echo
          echo "=== SECTIONS ==="
          cat work/elf/sections.txt || true

          echo
          echo "=== PROGRAM HEADERS ==="
          cat work/elf/program-headers.txt || true

          exit 0

      # ============================================================
      # 20. ARM64 DISASSEMBLY
      # ============================================================
      - name: Generate ARM64 disassembly
        shell: bash
        run: |
          set +e

          objdump \
            -d \
            -M no-aliases \
            work/libapp.so \
            > work/disassembly/libapp-objdump.txt \
            2>&1

          STATUS=$?

          echo "objdump exit code:"
          echo "$STATUS"

          wc -l \
            work/disassembly/libapp-objdump.txt \
            || true

          exit 0

      # ============================================================
      # 21. INSPECT FLUTTER ASSETS
      # ============================================================
      - name: Inspect Flutter assets
        shell: bash
        run: |
          set +e

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            echo
            echo "============================================================"
            echo "$APK"
            echo "============================================================"

            unzip -l "$APK" \
              2>/dev/null \
              | grep -Ei \
                "flutter_assets|flash_on|flash_off|flashlight|icon|AssetManifest" \
              || true

          done < work/apk-list.txt \
            > work/assets/flutter-assets.txt

          cat work/assets/flutter-assets.txt

          exit 0

      # ============================================================
      # 22. EXTRACT FLUTTER ASSETS
      # ============================================================
      - name: Extract Flutter assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets/extracted

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"

            mkdir -p \
              "work/assets/extracted/$NAME"

            unzip \
              -q \
              -o \
              "$APK" \
              "assets/flutter_assets/assets/*" \
              -d \
              "work/assets/extracted/$NAME" \
              2>/dev/null \
              || true

          done < work/apk-list.txt

          echo
          echo "Extracted assets:"

          find work/assets/extracted \
            -type f \
            -printf "%p %s bytes\n" \
            | sort \
            | tee work/assets/extracted-list.txt

          exit 0

      # ============================================================
      # 23. FINAL SUMMARY
      # ============================================================
      - name: Create final summary
        shell: bash
        run: |
          set +e

          mkdir -p work/final

          {
            echo "============================================================"
            echo "FLASHFY AOT ANALYSIS"
            echo "============================================================"
            echo

            echo "Repository:"
            echo "$GITHUB_REPOSITORY"
            echo

            echo "Commit:"
            git rev-parse HEAD
            echo

            echo "APK:"
            cat work/apk-list.txt
            echo

            echo "libapp.so source:"
            cat work/libapp-source.txt
            echo

            echo "libapp.so SHA256:"
            cat work/libapp.sha256
            echo

            echo "Dart snapshot hash:"
            cat work/snapshot-hash.txt \
              2>/dev/null \
              || echo "NOT DETECTED"
            echo

            echo "============================================================"
            echo "FLUTTERDEC INFO"
            echo "============================================================"

            cat work/info/info.json \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "ADAPTER INSTALL"
            echo "============================================================"

            cat work/adapter/install.json \
              2>/dev/null \
              || true

            echo

            cat work/adapter/list.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "FLUTTERDEC DECOMPILE LOG"
            echo "============================================================"

            cat work/flutterdec-out/decompile.log \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "FLASHFY SYMBOLS"
            echo "============================================================"

            cat work/symbols/flashfy-symbols.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "PAINTER SEARCH"
            echo "============================================================"

            cat work/search/painter-search.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "AOTOPSY"
            echo "============================================================"

            cat work/aotopsy-out/run.log \
              2>/dev/null \
              || true

          } > work/final/FINAL-SUMMARY.txt

          echo
          echo "============================================================"
          echo "FINAL SUMMARY"
          echo "============================================================"

          cat work/final/FINAL-SUMMARY.txt

      # ============================================================
      # 24. ZIP DIAGNOSTICS
      # ============================================================
      - name: Package diagnostics
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          zip \
            -r \
            artifacts/FlashFy-AOT-Diagnostics.zip \
            work \
            > /tmp/zip.log \
            2>&1

          echo
          echo "Created:"
          ls -lh artifacts/FlashFy-AOT-Diagnostics.zip

      # ============================================================
      # 25. UPLOAD DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Diagnostics
          path: artifacts/FlashFy-AOT-Diagnostics.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 26. UPLOAD RAW WORK
      # ============================================================
      - name: Upload raw analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Raw-Analysis
          path: work
          if-no-files-found: warn
          retention-days: 14
