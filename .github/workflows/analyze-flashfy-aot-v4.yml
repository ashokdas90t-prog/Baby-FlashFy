name: analyze-flashfy-aot-v4

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Show repository files
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 5 -type f | sort | sed -n '1,400p'

      # ============================================================
      # 3. Locate ALL APK files
      # ============================================================
      - name: Locate APK files
        shell: bash
        run: |
          set -e

          mkdir -p work

          echo "Searching for APK files..."

          find . \
            -type f \
            -iname '*.apk' \
            -print \
            | sort \
            | tee work/apk-list.txt

          if ! grep -q '\.apk$' work/apk-list.txt; then
            echo
            echo "ERROR: No APK files found."
            exit 1
          fi

          echo
          echo "APK files found:"
          cat work/apk-list.txt

      # ============================================================
      # 4. Find ARM64 libapp.so from ANY APK
      # ============================================================
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -e

          mkdir -p work/extracted
          mkdir -p work/apk-unpacked

          FOUND_LIBAPP=""

          echo "Checking every APK for libapp.so..."
          echo

          while IFS= read -r APK_FILE; do

            [ -z "$APK_FILE" ] && continue

            NAME="$(basename "$APK_FILE" .apk)"

            echo "------------------------------------------------------------"
            echo "Checking: $APK_FILE"
            echo "------------------------------------------------------------"

            OUT="work/apk-unpacked/$NAME"

            rm -rf "$OUT"
            mkdir -p "$OUT"

            if unzip -q "$APK_FILE" -d "$OUT"; then
              echo "APK extracted."
            else
              echo "WARNING: Could not extract $APK_FILE"
              continue
            fi

            LIB="$(
              find "$OUT" \
                -type f \
                \( \
                  -path '*/lib/arm64-v8a/libapp.so' \
                  -o \
                  -path '*/lib/arm64-v8a*/libapp.so' \
                \) \
                | head -n 1
            )"

            if [ -n "$LIB" ]; then
              echo
              echo "FOUND ARM64 libapp.so:"
              echo "$LIB"

              cp "$LIB" work/libapp.so

              echo "$APK_FILE" > work/libapp-source.txt

              FOUND_LIBAPP="yes"
              break
            fi

          done < work/apk-list.txt

          if [ -z "$FOUND_LIBAPP" ]; then

            echo
            echo "ERROR: ARM64 libapp.so was not found."
            echo
            echo "Searching all extracted files:"
            find work/apk-unpacked \
              -type f \
              | grep -Ei 'libapp\.so|arm64|lib/' \
              | sed -n '1,300p' || true

            echo
            echo "Searching APK ZIP contents:"
            while IFS= read -r APK_FILE; do
              echo
              echo "===== $APK_FILE ====="
              unzip -l "$APK_FILE" 2>/dev/null \
                | grep -Ei 'libapp\.so|arm64-v8a' \
                | head -n 100 || true
            done < work/apk-list.txt

            exit 1
          fi

          echo
          echo "============================================================"
          echo "libapp.so successfully extracted"
          echo "============================================================"

          ls -lh work/libapp.so
          file work/libapp.so

          sha256sum work/libapp.so \
            | tee work/libapp.sha256

          echo
          echo "Source APK:"
          cat work/libapp-source.txt

            # ============================================================
      # 5. Download Flutterdec alpha.4
      # ============================================================
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -e

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          echo "Downloading Flutterdec:"
          echo "$URL"

          rm -rf /opt/flutterdec
          mkdir -p /opt/flutterdec

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/flutterdec.tar.gz \
            "$URL"

          echo
          echo "Downloaded:"
          ls -lh /tmp/flutterdec.tar.gz

          echo
          echo "Archive contents:"
          tar -tzf /tmp/flutterdec.tar.gz \
            | sed -n '1,80p'

          echo
          echo "Extracting Flutterdec..."

          tar \
            -xzf /tmp/flutterdec.tar.gz \
            -C /opt/flutterdec

          echo
          echo "Extracted files:"
          find /opt/flutterdec \
            -maxdepth 6 \
            -type f \
            | sort \
            | sed -n '1,300p'

          echo
          echo "Locating flutterdec binary..."

          FLUTTERDEC_BIN="$(
            find /opt/flutterdec \
              -type f \
              -path '*/bin/flutterdec' \
              -print \
              | head -n 1
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            echo "ERROR: flutterdec binary not found."
            exit 1
          fi

          FLUTTERDEC_PREFIX="$(dirname "$(dirname "$FLUTTERDEC_BIN")")"

          echo
          echo "Flutterdec binary:"
          echo "$FLUTTERDEC_BIN"

          echo
          echo "Flutterdec prefix:"
          echo "$FLUTTERDEC_PREFIX"

          test -f "$FLUTTERDEC_PREFIX/bin/flutterdec"
          test -f "$FLUTTERDEC_PREFIX/share/flutterdec/adapters/registry.json"

          chmod +x "$FLUTTERDEC_PREFIX/bin/flutterdec"

          echo
          echo "Flutterdec version:"
          "$FLUTTERDEC_PREFIX/bin/flutterdec" --version || true

          echo "FLUTTERDEC=$FLUTTERDEC_PREFIX/bin/flutterdec" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=$FLUTTERDEC_PREFIX/share/flutterdec" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 6. Flutterdec info
      # ============================================================
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          mkdir -p work/flutterdec-info

          echo "Running Flutterdec info..."

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/flutterdec-info/info.json \
            2>&1

          STATUS=$?

          echo "Exit code: $STATUS"

          cat work/flutterdec-info/info.json || true

          exit 0

      # ============================================================
      # 7. Detect Dart snapshot hash
      # ============================================================
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set +e

          INFO="work/flutterdec-info/info.json"

          HASH=""

          echo "Searching Flutterdec info for Dart hash..."

          if [ -f "$INFO" ]; then

            HASH="$(
              grep -Eio \
                '[0-9a-f]{32,64}' \
                "$INFO" \
                | head -n 1
            )

          fi

          if [ -z "$HASH" ]; then

            echo "No hash found in Flutterdec info."

            echo
            echo "Trying strings from libapp.so..."

            HASH="$(
              strings -a work/libapp.so \
              | grep -Eio '[0-9a-f]{32,64}' \
              | head -n 1
            )"

          fi

          if [ -n "$HASH" ]; then

            HASH="$(echo "$HASH" | tr '[:upper:]' '[:lower:]')"

            echo
            echo "Detected Dart snapshot hash:"
            echo "$HASH"

            echo "$HASH" > work/dart-snapshot-hash.txt

            echo "SNAPSHOT_HASH=$HASH" \
              >> "$GITHUB_ENV"

          else

            echo
            echo "WARNING: Dart snapshot hash was not detected."

            echo "SNAPSHOT_HASH=" \
              >> "$GITHUB_ENV"

          fi

      # ============================================================
      # 8. Prepare adapter directories
      # ============================================================
      - name: Prepare Flutterdec adapter directories
        shell: bash
        run: |
          set -e

          mkdir -p work/flutterdec-adapters
          mkdir -p work/adapter

          echo "FLUTTERDEC_ADAPTER_STORE=$GITHUB_WORKSPACE/work/flutterdec-adapters" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=/opt/flutterdec/share/flutterdec" \
            >> "$GITHUB_ENV"

          echo "Adapter store:"
          find work/flutterdec-adapters \
            -maxdepth 4 \
            -type f \
            | sort \
            || true

      # ============================================================
      # 9. Install matching adapter
      # ============================================================
      - name: Install matching Flutterdec adapter
        shell: bash
        run: |
          set +e

          if [ -z "${SNAPSHOT_HASH:-}" ]; then

            echo "Snapshot hash is empty."
            echo "Adapter installation skipped."

            cat > work/adapter/status.txt <<'EOF'
          Snapshot hash was not detected.
          Adapter installation was skipped.
          EOF

            exit 0
          fi

          echo "Installing adapter:"
          echo "$SNAPSHOT_HASH"

          "$FLUTTERDEC" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            > work/adapter/install.json \
            2>&1

          STATUS=$?

          echo "Adapter install exit code: $STATUS"

          cat work/adapter/install.json || true

          echo
          echo "Installed adapter list:"

          "$FLUTTERDEC" \
            adapter list \
            > work/adapter/list.txt \
            2>&1

          cat work/adapter/list.txt || true

          exit 0

      # ============================================================
      # 10. Decompile with Flutterdec
      # ============================================================
      - name: Decompile Flutter AOT
        shell: bash
        run: |
          set +e

          rm -rf work/flutterdec-out
          mkdir -p work/flutterdec-out

          echo "Starting Flutterdec decompile..."

          "$FLUTTERDEC" \
            decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --function-scope all \
            > work/flutterdec-out/decompile.log \
            2>&1

          STATUS=$?

          echo
          echo "Flutterdec exit code:"
          echo "$STATUS"

          echo
          echo "Decompile log:"
          cat work/flutterdec-out/decompile.log || true

          echo
          echo "Generated files:"

          find work/flutterdec-out \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | sed -n '1,500p'

          exit 0

      # ============================================================
      # 11. Install Python analysis tools
      # ============================================================
      - name: Install Python analysis tools
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            capstone \
            pyelftools

      # ============================================================
      # 12. Clone AOTopsy
      # ============================================================
      - name: Clone AOTopsy
        shell: bash
        run: |
          set -e

          rm -rf work/aotopsy

          git clone \
            --depth 1 \
            https://github.com/BroNils/aotopsy.git \
            work/aotopsy

          echo
          echo "AOTopsy files:"
          find work/aotopsy \
            -maxdepth 4 \
            -type f \
            | sort \
            | sed -n '1,400p'

      # ============================================================
      # 13. Install AOTopsy
      # ============================================================
      - name: Install AOTopsy
        shell: bash
        run: |
          set +e

          cd work/aotopsy

          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

          if [ -f pyproject.toml ]; then
            python3 -m pip install .
          elif [ -f setup.py ]; then
            python3 -m pip install .
          fi

          echo
          echo "Testing AOTopsy..."

          python3 -m aotopsy \
            --help \
            > "$GITHUB_WORKSPACE/work/aotopsy-help.txt" \
            2>&1

          STATUS=$?

          echo "AOTopsy help exit code: $STATUS"

          cat "$GITHUB_WORKSPACE/work/aotopsy-help.txt" || true

          exit 0

      # ============================================================
      # 14. Run AOTopsy
      # ============================================================
      - name: Analyze libapp.so with AOTopsy
        shell: bash
        run: |
          set +e

          mkdir -p work/aotopsy-out

          echo "Running AOTopsy..."

          python3 -m aotopsy \
            work/libapp.so \
            --output work/aotopsy-out \
            > work/aotopsy-out/run.log \
            2>&1

          STATUS=$?

          echo
          echo "AOTopsy exit code:"
          echo "$STATUS"

          echo
          echo "AOTopsy log:"
          cat work/aotopsy-out/run.log || true

          echo
          echo "AOTopsy output:"
          find work/aotopsy-out \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | sed -n '1,500p'

          exit 0

      # ============================================================
      # 15. Extract FlashFy symbols
      # ============================================================
      - name: Extract FlashFy painter symbols
        shell: bash
        run: |
          set -e

          mkdir -p work/symbols

          strings \
            -a \
            -t x \
            work/libapp.so \
            > work/symbols/all-strings.txt

          grep -Ei \
            'FlashfyScreen|FlashfyController|_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|toggleFlash|isFlashOn|TorchService|torch_service.dart|flashfy_screen.dart|flashfy_controller.dart' \
            work/symbols/all-strings.txt \
            > work/symbols/flashfy-symbols.txt \
            || true

          echo
          echo "============================================================"
          echo "FlashFy symbols"
          echo "============================================================"

          cat work/symbols/flashfy-symbols.txt || true

      # ============================================================
      # 16. ELF information
      # ============================================================
      - name: Inspect ELF
        shell: bash
        run: |
          set +e

          mkdir -p work/elf

          file work/libapp.so \
            > work/elf/file.txt \
            2>&1

          readelf -h work/libapp.so \
            > work/elf/header.txt \
            2>&1

          readelf -S work/libapp.so \
            > work/elf/sections.txt \
            2>&1

          readelf -l work/libapp.so \
            > work/elf/program-headers.txt \
            2>&1

          readelf -s work/libapp.so \
            > work/elf/symbol-table.txt \
            2>&1

          echo "=== FILE ==="
          cat work/elf/file.txt || true

          echo
          echo "=== HEADER ==="
          cat work/elf/header.txt || true

          echo
          echo "=== SECTIONS ==="
          cat work/elf/sections.txt || true

          echo
          echo "=== PROGRAM HEADERS ==="
          cat work/elf/program-headers.txt || true

          exit 0

      # ============================================================
      # 17. ARM64 disassembly
      # ============================================================
      - name: Generate ARM64 disassembly
        shell: bash
        run: |
          set +e

          mkdir -p work/disassembly

          objdump \
            -d \
            -M no-aliases \
            work/libapp.so \
            > work/disassembly/libapp-objdump.txt \
            2>&1

          STATUS=$?

          echo "objdump exit code: $STATUS"

          wc -l \
            work/disassembly/libapp-objdump.txt \
            || true

          exit 0

      # ============================================================
      # 18. Search painter functions in ALL outputs
      # ============================================================
      - name: Search recovered painter functions
        shell: bash
        run: |
          set +e

          mkdir -p work/search

          PATTERN='_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|torch_service.dart|flashfy_screen.dart|flashfy_controller.dart'

          {
            echo "============================================================"
            echo "Flutterdec"
            echo "============================================================"

            grep -RniE \
              "$PATTERN" \
              work/flutterdec-out \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "AOTopsy"
            echo "============================================================"

            grep -RniE \
              "$PATTERN" \
              work/aotopsy-out \
              2>&1 \
              || true

            echo
            echo "============================================================"
            echo "Strings"
            echo "============================================================"

            cat work/symbols/flashfy-symbols.txt \
              2>/dev/null \
              || true

          } > work/search/painter-search.txt

          cat work/search/painter-search.txt

          exit 0

      # ============================================================
      # 19. Extract nearby string context
      # ============================================================
      - name: Extract Flutter method context
        shell: bash
        run: |
          set +e

          mkdir -p work/context

          python3 <<'PY'
          from pathlib import Path

          source = Path("work/symbols/all-strings.txt")
          output = Path("work/context/flutter-method-context.txt")

          if not source.exists():
              output.write_text("strings file not found\n")
              raise SystemExit(0)

          lines = source.read_text(
              errors="replace"
          ).splitlines()

          patterns = [
              "_RopeBulbPainter",
              "_drawBulb",
              "_drawPullRope",
              "_BackgroundPainter",
              "_paintBackgroundImage",
              "_paintBackgroundColor",
              "_drawImageScaledAndCentered",
              "_FlashfyScreenState",
              "FlashfyScreen",
              "FlashfyController",
              "toggleFlash",
              "isFlashOn",
              "TorchService",
              "torch_service.dart",
              "flashfy_screen.dart",
              "flashfy_controller.dart",
          ]

          result = []

          for index, line in enumerate(lines):

              if any(pattern in line for pattern in patterns):

                  start = max(0, index - 20)
                  end = min(len(lines), index + 21)

                  result.append(
                      f"\n===== MATCH LINE {index + 1} =====\n"
                  )

                  result.extend(lines[start:end])

          output.write_text(
              "\n".join(result),
              encoding="utf-8",
              errors="replace",
          )

          print(
              output.read_text(
                  encoding="utf-8",
                  errors="replace"
              )[:100000]
          )
          PY

          exit 0

      # ============================================================
      # 20. Inspect Flutter assets
      # ============================================================
      - name: Inspect Flutter assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets

          while IFS= read -r APK_FILE; do

            [ -z "$APK_FILE" ] && continue

            NAME="$(basename "$APK_FILE" .apk)"

            echo
            echo "============================================================"
            echo "$APK_FILE"
            echo "============================================================"

            unzip -l "$APK_FILE" \
              2>/dev/null \
              | grep -Ei \
                'flutter_assets|flash_on|flash_off|flashlight|icon|AssetManifest' \
              || true

          done < work/apk-list.txt \
            > work/assets/flutter-assets.txt

          cat work/assets/flutter-assets.txt

          exit 0

      # ============================================================
      # 21. Extract Flutter image assets
      # ============================================================
      - name: Extract Flutter image assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets/extracted

          while IFS= read -r APK_FILE; do

            [ -z "$APK_FILE" ] && continue

            NAME="$(basename "$APK_FILE" .apk)"

            mkdir -p "work/assets/extracted/$NAME"

            unzip \
              -q \
              -o \
              "$APK_FILE" \
              'assets/flutter_assets/assets/*' \
              -d "work/assets/extracted/$NAME" \
              2>/dev/null \
              || true

          done < work/apk-list.txt

          echo
          echo "Extracted asset files:"

          find work/assets/extracted \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | tee work/assets/extracted-list.txt

          exit 0

      # ============================================================
      # 22. Create final diagnostic summary
      # ============================================================
      - name: Create final diagnostic summary
        shell: bash
        run: |
          set +e

          mkdir -p work/final

          {
            echo "============================================================"
            echo "FlashFy Flutter AOT Analysis"
            echo "============================================================"
            echo

            echo "Repository:"
            echo "$GITHUB_REPOSITORY"
            echo

            echo "Commit:"
            git rev-parse HEAD
            echo

            echo "APK files:"
            cat work/apk-list.txt
            echo

            echo "libapp.so source:"
            cat work/libapp-source.txt
            echo

            echo "libapp.so SHA256:"
            cat work/libapp.sha256
            echo

            echo "Dart snapshot hash:"
            echo "${SNAPSHOT_HASH:-NOT DETECTED}"
            echo

            echo "============================================================"
            echo "FlashFy painter symbols"
            echo "============================================================"

            cat work/symbols/flashfy-symbols.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "Painter search"
            echo "============================================================"

            cat work/search/painter-search.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "Flutterdec log"
            echo "============================================================"

            cat work/flutterdec-out/decompile.log \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "AOTopsy log"
            echo "============================================================"

            cat work/aotopsy-out/run.log \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "Flutter assets"
            echo "============================================================"

            cat work/assets/flutter-assets.txt \
              2>/dev/null \
              || true

          } > work/final/FINAL-SUMMARY.txt

          echo
          echo "============================================================"
          echo "FINAL SUMMARY"
          echo "============================================================"

          cat work/final/FINAL-SUMMARY.txt

      # ============================================================
      # 23. Package ALL diagnostics
      # ============================================================
      - name: Package diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          zip \
            -r \
            artifacts/FlashFy-AOT-Diagnostics.zip \
            work \
            > /tmp/diagnostics-zip.log \
            2>&1

          echo "Created:"
          ls -lh artifacts/FlashFy-AOT-Diagnostics.zip

      # ============================================================
      # 24. Upload diagnostic ZIP
      # ============================================================
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Diagnostics
          path: artifacts/FlashFy-AOT-Diagnostics.zip
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 25. Upload raw analysis
      # ============================================================
      - name: Upload raw analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Raw-Analysis
          path: work
          if-no-files-found: warn
          retention-days: 14
