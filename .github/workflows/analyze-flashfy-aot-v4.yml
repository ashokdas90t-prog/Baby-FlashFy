name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:
  push:
    paths:
      - "base.apk"
      - "split_config.arm64_v8a.apk"
      - "split_config.en.apk"
      - "split_config.xxhdpi.apk"
      - ".github/workflows/analyze-flashfy-aot-v4.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check APK inputs
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do
            test -s "$f" || {
              echo "Missing APK: $f"
              exit 1
            }
          done

          echo "APK inputs: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKEditor
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" \
            -o APKEditor.jar

          test -s APKEditor.jar

      - name: Merge original split APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p \
            work/splits \
            work/info \
            work/decompile \
            work/focused \
            work/native

          cp \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            work/splits/

          java -Xmx4g -jar APKEditor.jar \
            m \
            -i work/splits \
            -o work/flashfy.apk

          test -s work/flashfy.apk

          unzip -l work/flashfy.apk \
            | grep -q "lib/arm64-v8a/libapp.so"

          echo "Merged APK: PASS"

      - name: Download flutterdec release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"
          ARCHIVE="flutterdec-${VERSION}-Linux-X64.tar.gz"

          curl -fL \
            "https://github.com/caverav/flutterdec/releases/download/${VERSION}/${ARCHIVE}" \
            -o "work/${ARCHIVE}"

          test -s "work/${ARCHIVE}"

          mkdir -p work/flutterdec

          tar -xzf \
            "work/${ARCHIVE}" \
            -C work/flutterdec

          echo "=== RELEASE ARCHIVE TREE ==="
          find work/flutterdec \
            -maxdepth 12 \
            -type f \
            -print \
            | sort

          FLUTTERDEC_BIN="$(
            find work/flutterdec \
              -type f \
              -name flutterdec \
              -print \
              -quit
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            echo "ERROR: flutterdec executable not found."
            exit 1
          fi

          chmod +x "$FLUTTERDEC_BIN"
          FLUTTERDEC_BIN="$(realpath "$FLUTTERDEC_BIN")"

          echo "FLUTTERDEC_BIN=$FLUTTERDEC_BIN" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$FLUTTERDEC_BIN"

          "$FLUTTERDEC_BIN" --version
          "$FLUTTERDEC_BIN" --help >/dev/null

          echo "flutterdec binary: PASS"

      - name: Inspect Flutter AOT snapshot
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FLUTTERDEC INFO ==="

          "$FLUTTERDEC_BIN" \
            info \
            work/flashfy.apk \
            --json \
            | tee work/info/flutterdec-info.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/flutterdec-info.json")
          raw = p.read_text(errors="replace")

          decoder = json.JSONDecoder()
          data = None

          for i, ch in enumerate(raw):
              if ch != "{":
                  continue
              try:
                  obj, _ = decoder.raw_decode(raw[i:])
                  if isinstance(obj, dict):
                      data = obj
                      break
              except json.JSONDecodeError:
                  pass

          if data is None:
              print("Could not parse flutterdec JSON.")
              print(raw[:12000])
              raise SystemExit(1)

          p.write_text(json.dumps(data, indent=2) + "\n")

          snapshot_hash = data.get("snapshot_hash")
          print("SNAPSHOT_HASH:", snapshot_hash or "UNAVAILABLE")

          if snapshot_hash:
              Path("work/info/snapshot_hash.txt").write_text(
                  snapshot_hash + "\n"
              )
          else:
              Path("work/info/snapshot_hash.txt").write_text(
                  "UNAVAILABLE\n"
              )
          PY

      - name: Extract native Flutter library
        shell: bash
        run: |
          set -euo pipefail

          unzip -p \
            work/flashfy.apk \
            lib/arm64-v8a/libapp.so \
            > work/native/libapp.so

          test -s work/native/libapp.so

          echo "=== ELF INFO ==="
          file work/native/libapp.so
          readelf -h work/native/libapp.so | tee work/native/readelf-header.txt
          readelf -S work/native/libapp.so | tee work/native/readelf-sections.txt

          echo "=== PAINTER STRING OFFSETS ==="

          strings -t x work/native/libapp.so \
            | grep -E \
              '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|toggleFlash|isFlashOn' \
            | tee work/native/painter-string-offsets.txt \
            || true

          echo "=== ALL FLASHFY DART STRING REFERENCES ==="

          strings -t x work/native/libapp.so \
            | grep -E \
              'flashfy_screen.dart|flashfy_controller.dart|torch_service.dart|FlashfyController|FlashfyScreen|toggleFlash|isFlashOn' \
            | tee work/native/flashfy-string-offsets.txt \
            || true

      - name: Decompile FlashFy with internal flutterdec backend
        shell: bash
        run: |
          set +e

          rm -rf work/decompile
          mkdir -p work/decompile

          echo "=== INTERNAL BACKEND DECOMPILE ==="

          "$FLUTTERDEC_BIN" \
            decompile \
            work/flashfy.apk \
            -o work/decompile \
            --adapter-backend internal \
            --emit-asm \
            --emit-ir \
            2>&1 \
            | tee work/decompile/decompile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" > work/decompile/exit-code.txt

          echo "flutterdec decompile exit code: $RC"

          echo "=== DECOMPILE FILES ==="

          find work/decompile \
            -maxdepth 10 \
            -type f \
            -print \
            | sort

          # The CLI can return non-zero for quality-gate reasons while
          # still leaving useful analysis artifacts. Do not hide the RC.
          exit 0

      - name: Search FlashFy painter functions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/focused

          {
            echo "========================================"
            echo "FLASHFY PAINTER FUNCTION SEARCH"
            echo "========================================"
            echo

            echo "=== flutterdec output ==="
            grep -RniE \
              '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|toggleFlash|isFlashOn' \
              work/decompile \
              2>/dev/null \
              || true

            echo
            echo "=== native libapp.so string offsets ==="
            cat work/native/painter-string-offsets.txt \
              2>/dev/null \
              || true

            echo
            echo "=== FlashFy native strings ==="
            cat work/native/flashfy-string-offsets.txt \
              2>/dev/null \
              || true

            echo
            echo "=== DART PSEUDO FILES ==="
            find work/decompile \
              -type f \
              -name '*.dartpseudo' \
              -print \
              | sort

            echo
            echo "=== DART FILES ==="
            find work/decompile \
              -type f \
              -name '*.dart' \
              -print \
              | sort

            echo
            echo "=== ASM FILES ==="
            find work/decompile \
              -type f \
              -name '*.asm' \
              -print \
              | sort

            echo
            echo "=== IR FILES ==="
            find work/decompile \
              -type f \
              -name '*.ir' \
              -print \
              | sort

            echo
            echo "=== JSON REPORTS ==="
            find work/decompile \
              -type f \
              -name '*.json' \
              -print \
              | sort

          } | tee work/focused/painter-search.txt

      - name: Create focused report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "FlashFy Flutter AOT Analysis"
            echo "============================="
            echo

            echo "Snapshot hash:"
            cat work/info/snapshot_hash.txt

            echo
            echo "Flutterdec info:"
            cat work/info/flutterdec-info.json

            echo
            echo "Decompile exit code:"
            cat work/decompile/exit-code.txt

            echo
            echo "Painter/native analysis:"
            cat work/focused/painter-search.txt

          } | tee work/focused/REPORT.txt

      - name: Upload AOT analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-analysis
          path: |
            work/info/
            work/native/
            work/decompile/
            work/focused/
          if-no-files-found: warn
          retention-days: 7
