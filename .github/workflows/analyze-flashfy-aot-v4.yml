name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:
  push:
    paths:
      - "base.apk"
      - "split_config.arm64_v8a.apk"
      - "split_config.en.apk"
      - "split_config.xxhdpi.apk"
      - ".github/workflows/analyze-flashfy-aot-v4.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check APK inputs
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do
            test -s "$f" || {
              echo "Missing APK: $f"
              exit 1
            }
          done

          echo "APK inputs: PASS"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APKEditor
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar" \
            -o APKEditor.jar

          test -s APKEditor.jar

          echo "APKEditor: PASS"

      - name: Merge original split APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p \
            work/splits \
            work/info \
            work/decompile \
            work/focused

          cp \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk \
            work/splits/

          java -Xmx4g -jar APKEditor.jar \
            m \
            -i work/splits \
            -o work/flashfy.apk

          test -s work/flashfy.apk

          unzip -l work/flashfy.apk \
            | grep -q "lib/arm64-v8a/libapp.so"

          echo "Merged APK: PASS"

      - name: Download flutterdec release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"
          ARCHIVE="flutterdec-${VERSION}-Linux-X64.tar.gz"

          curl -fL \
            "https://github.com/caverav/flutterdec/releases/download/${VERSION}/${ARCHIVE}" \
            -o "work/${ARCHIVE}"

          test -s "work/${ARCHIVE}"

          mkdir -p work/flutterdec

          tar -xzf \
            "work/${ARCHIVE}" \
            -C work/flutterdec

          echo "=== FLUTTERDEC FILES ==="

          find work/flutterdec \
            -maxdepth 10 \
            -type f \
            -print \
            | sort

          FLUTTERDEC_BIN="$(
            find work/flutterdec \
              -type f \
              -name flutterdec \
              -print \
              -quit
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            echo "ERROR: flutterdec executable not found."
            exit 1
          fi

          chmod +x "$FLUTTERDEC_BIN"

          FLUTTERDEC_BIN="$(realpath "$FLUTTERDEC_BIN")"

          echo "FLUTTERDEC_BIN=$FLUTTERDEC_BIN" \
            >> "$GITHUB_ENV"

          echo "Using flutterdec:"
          echo "$FLUTTERDEC_BIN"

          "$FLUTTERDEC_BIN" --version

          "$FLUTTERDEC_BIN" --help >/dev/null

          echo "flutterdec binary: PASS"

      - name: Configure matching flutterdec release data
        shell: bash
        run: |
          set -euo pipefail

          echo "=== FLUTTERDEC RELEASE TREE ==="

          find work/flutterdec \
            -maxdepth 12 \
            -type f \
            -print \
            | sort

          FLUTTERDEC_BIN="$(
            find work/flutterdec \
              -type f \
              -name flutterdec \
              -print \
              -quit
          )"

          if [ -z "$FLUTTERDEC_BIN" ]; then
            echo "ERROR: flutterdec executable not found."
            exit 1
          fi

          FLUTTERDEC_BIN="$(realpath "$FLUTTERDEC_BIN")"

          SHARE_DIR="$(
            find work/flutterdec \
              -type f \
              -path '*/share/flutterdec/adapters/registry.json' \
              -print \
              -quit \
          )"

          if [ -z "$SHARE_DIR" ]; then
            echo "ERROR: release share/flutterdec/adapters/registry.json not found."
            echo "The release archive must contain bin/flutterdec and share/flutterdec."
            exit 1
          fi

          FLUTTERDEC_DATA_DIR="$(dirname "$(dirname "$(dirname "$SHARE_DIR")")")"

          test -f \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json"

          test -f \
            "$FLUTTERDEC_DATA_DIR/adapters/python/adapter_template.py"

          test -d \
            "$FLUTTERDEC_DATA_DIR/data"

          echo "Flutterdec binary:"
          echo "$FLUTTERDEC_BIN"

          echo "Flutterdec packaged data:"
          echo "$FLUTTERDEC_DATA_DIR"

          echo "Registry:"
          ls -lh \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json"

          echo "Adapter template:"
          ls -lh \
            "$FLUTTERDEC_DATA_DIR/adapters/python/adapter_template.py"

          echo "Runtime data:"
          ls -ld \
            "$FLUTTERDEC_DATA_DIR/data"

          echo "FLUTTERDEC_BIN=$FLUTTERDEC_BIN" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=$FLUTTERDEC_DATA_DIR" \
            >> "$GITHUB_ENV"

          echo "Matching release data: PASS"

      - name: Inspect Flutter AOT snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/info

          echo "=== FLUTTERDEC INFO ==="

          "$FLUTTERDEC_BIN" \
            info \
            work/flashfy.apk \
            --json \
            | tee work/info/flutterdec-info.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/flutterdec-info.json")
          raw = p.read_text(errors="replace")

          decoder = json.JSONDecoder()
          data = None

          for i, ch in enumerate(raw):
              if ch != "{":
                  continue

              try:
                  obj, _ = decoder.raw_decode(raw[i:])
                  if isinstance(obj, dict):
                      data = obj
                      break
              except json.JSONDecodeError:
                  pass

          if data is None:
              print("Could not parse flutterdec JSON.")
              print(raw[:12000])
              raise SystemExit(1)

          p.write_text(
              json.dumps(data, indent=2) + "\n"
          )

          snapshot_hash = data.get("snapshot_hash")

          if not snapshot_hash:
              raise SystemExit(
                  "snapshot_hash not found in flutterdec info"
              )

          Path(
              "work/info/snapshot_hash.txt"
          ).write_text(
              snapshot_hash + "\n"
          )

          print(
              "SNAPSHOT_HASH:",
              snapshot_hash
          )
          PY

      - name: Install matching flutterdec adapter
        shell: bash
        run: |
          set -euo pipefail

          HASH="$(
            tr -d '\r\n ' \
            < work/info/snapshot_hash.txt
          )"

          test -n "$HASH"

          rm -rf "$GITHUB_WORKSPACE/work/adapter-store"

          export FLUTTERDEC_ADAPTER_STORE="$GITHUB_WORKSPACE/work/adapter-store"

          mkdir -p "$FLUTTERDEC_ADAPTER_STORE"

          echo "Installing adapter for snapshot hash:"
          echo "$HASH"

          test -f \
            "$GITHUB_WORKSPACE/adapters/python/adapter_template.py"

          "$FLUTTERDEC_BIN" \
            adapter install \
            --dart-hash "$HASH" \
            2>&1 \
            | tee work/info/adapter-install.txt

          echo "=== ADAPTER LIST ==="

          "$FLUTTERDEC_BIN" \
            adapter list \
            2>&1 \
            | tee work/info/adapter-list.txt

          echo "Adapter installation: PASS"

      - name: Decompile FlashFy Flutter code
        shell: bash
        run: |
          set +e

          export FLUTTERDEC_ADAPTER_STORE="$GITHUB_WORKSPACE/work/adapter-store"
          export FLUTTERDEC_DATA_DIR="$FLUTTERDEC_DATA_DIR"

          rm -rf work/decompile
          mkdir -p work/decompile

          echo "=== DECOMPILE ==="

          "$FLUTTERDEC_BIN" \
            decompile \
            work/flashfy.apk \
            -o work/decompile \
            --emit-asm \
            --emit-ir \
            2>&1 \
            | tee work/decompile/decompile.log

          RC=${PIPESTATUS[0]}

          echo "$RC" \
            > work/decompile/exit-code.txt

          echo "flutterdec decompile exit code: $RC"

          echo "=== DECOMPILE FILES ==="

          find work/decompile \
            -maxdepth 8 \
            -type f \
            -print \
            | sort

          echo "Decompile step completed."

          # flutterdec may return non-zero because of quality gates
          # even when useful analysis artifacts were produced.
          exit 0

      - name: Search FlashFy painter functions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/focused

          {
            echo "========================================"
            echo "FLASHFY PAINTER FUNCTION SEARCH"
            echo "========================================"
            echo

            grep -RniE \
              '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|toggleFlash|isFlashOn' \
              work/decompile \
              2>/dev/null \
              || true

            echo
            echo "========================================"
            echo "DART PSEUDO FILES"
            echo "========================================"

            find work/decompile \
              -type f \
              -name '*.dartpseudo' \
              -print \
              | sort

            echo
            echo "========================================"
            echo "DART FILES"
            echo "========================================"

            find work/decompile \
              -type f \
              -name '*.dart' \
              -print \
              | sort

            echo
            echo "========================================"
            echo "ASM FILES"
            echo "========================================"

            find work/decompile \
              -type f \
              -name '*.asm' \
              -print \
              | sort

            echo
            echo "========================================"
            echo "IR FILES"
            echo "========================================"

            find work/decompile \
              -type f \
              -name '*.ir' \
              -print \
              | sort

            echo
            echo "========================================"
            echo "REPORT FILES"
            echo "========================================"

            find work/decompile \
              -type f \
              -name '*.json' \
              -print \
              | sort

          } | tee \
            work/focused/painter-search.txt

      - name: Create focused report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "FlashFy Flutter AOT Analysis"
            echo "============================="
            echo

            echo "Snapshot hash:"
            cat work/info/snapshot_hash.txt

            echo
            echo "Adapter installation:"
            cat work/info/adapter-install.txt \
              || true

            echo
            echo "Adapter list:"
            cat work/info/adapter-list.txt \
              || true

            echo
            echo "Painter search:"
            cat work/focused/painter-search.txt \
              || true

            echo
            echo "Decompile exit code:"
            cat work/decompile/exit-code.txt \
              || true

            echo
            echo "Decompile log:"
            cat work/decompile/decompile.log \
              || true

          } > \
            work/focused/FLASHFY-AOT-REPORT.txt

      - name: Upload AOT analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-analysis
          path: |
            work/info/**
            work/focused/**
            work/decompile/**
          if-no-files-found: warn
          retention-days: 7
