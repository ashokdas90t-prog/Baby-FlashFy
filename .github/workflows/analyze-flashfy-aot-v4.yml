name: analyze-aot

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSPECT REPOSITORY
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 5 -type f | sort | head -1000

      # ============================================================
      # 3. FIND APK
      # ============================================================
      - name: Locate APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          find . \
            -type f \
            -iname "*.apk" \
            -print \
            | sort \
            | tee work/apk-list.txt

          if ! grep -q "\.apk$" work/apk-list.txt; then
            echo "ERROR: No APK found."
            exit 1
          fi

      # ============================================================
      # 4. EXTRACT ARM64 LIBAPP.SO
      # ============================================================
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/apk-unpacked

          FOUND=""

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"
            OUT="work/apk-unpacked/$NAME"

            rm -rf "$OUT"
            mkdir -p "$OUT"

            echo
            echo "Checking:"
            echo "$APK"

            unzip -q "$APK" -d "$OUT"

            LIBAPP="$(
              find "$OUT" \
                -type f \
                -path "*/lib/arm64-v8a/libapp.so" \
                | head -n 1
            )"

            if [ -n "$LIBAPP" ]; then

              echo
              echo "FOUND:"
              echo "$LIBAPP"

              cp "$LIBAPP" work/libapp.so

              echo "$APK" \
                > work/libapp-source.txt

              FOUND="yes"
              break

            fi

          done < work/apk-list.txt

          if [ -z "$FOUND" ]; then
            echo "ERROR: ARM64 libapp.so not found."
            exit 1
          fi

          echo
          file work/libapp.so

          echo
          ls -lh work/libapp.so

          sha256sum work/libapp.so \
            | tee work/libapp.sha256

      # ============================================================
      # 5. DOWNLOAD FLUTTERDEC ALPHA.4
      # ============================================================
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          mkdir -p work/flutterdec

          echo "Downloading:"
          echo "$URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o work/flutterdec/flutterdec.tar.gz

          echo
          echo "Archive:"
          tar -tzf work/flutterdec/flutterdec.tar.gz

          rm -rf work/flutterdec/extracted

          mkdir -p work/flutterdec/extracted

          tar \
            -xzf work/flutterdec/flutterdec.tar.gz \
            -C work/flutterdec/extracted

          echo
          echo "Extracted:"
          find work/flutterdec/extracted \
            -type f \
            -printf "%p\n"

          # The actual alpha.4 archive contains a flat executable.
          BIN="$(
            find work/flutterdec/extracted \
              -type f \
              -name flutterdec \
              | head -n 1
          )"

          if [ -z "$BIN" ]; then
            echo "ERROR: Flutterdec executable not found."
            exit 1
          fi

          mkdir -p /opt/flutterdec

          cp "$BIN" /opt/flutterdec/flutterdec

          chmod +x /opt/flutterdec/flutterdec

          echo "FLUTTERDEC=/opt/flutterdec/flutterdec" \
            >> "$GITHUB_ENV"

          echo
          echo "Flutterdec:"
          /opt/flutterdec/flutterdec --version

      # ============================================================
      # 6. PREPARE FLUTTERDEC STORE
      # ============================================================
      - name: Prepare Flutterdec adapter store
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/work/flutterdec-adapters"

          echo "FLUTTERDEC_ADAPTER_STORE=$GITHUB_WORKSPACE/work/flutterdec-adapters" \
            >> "$GITHUB_ENV"

          echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/work/xdg-data" \
            >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/work/xdg-data"

      # ============================================================
      # 7. FLUTTERDEC INFO
      # ============================================================
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          mkdir -p work/info

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info.json \
            2> work/info/info.stderr

          STATUS=$?

          echo "Flutterdec info exit code:"
          echo "$STATUS"

          echo
          echo "INFO JSON:"
          cat work/info/info.json || true

          echo
          echo "INFO STDERR:"
          cat work/info/info.stderr || true

          # info may return non-zero when an adapter is unavailable.
          exit 0

      # ============================================================
      # 8. EXTRACT SNAPSHOT HASH
      # ============================================================
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set -euo pipefail

          HASH=""

          if [ -s work/info/info.json ]; then

            HASH="$(
              python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/info.json")

          try:
              data = json.loads(
                  p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )
          except Exception:
              raise SystemExit(0)

          value = data.get("snapshot_hash")

          if isinstance(value, str):
              value = value.strip().lower()

              if len(value) == 32:
                  print(value)
          PY
            )"

          fi

          if [ -z "$HASH" ]; then
            echo
            echo "ERROR: snapshot_hash was not found."

            echo
            echo "Flutterdec info:"
            cat work/info/info.json || true

            exit 1
          fi

          echo
          echo "============================================================"
          echo "DART SNAPSHOT HASH"
          echo "============================================================"
          echo "$HASH"

          echo "$HASH" \
            > work/snapshot-hash.txt

          echo "SNAPSHOT_HASH=$HASH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 9. INSTALL MATCHING ADAPTER
      # ============================================================
      - name: Install matching Flutterdec adapter
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "INSTALLING ADAPTER"
          echo "============================================================"

          echo "Snapshot:"
          echo "$SNAPSHOT_HASH"

          rm -rf work/adapter

          mkdir -p work/adapter

          "$FLUTTERDEC" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            > work/adapter/install.txt \
            2>&1

          STATUS=$?

          echo
          echo "Adapter install exit code:"
          echo "$STATUS"

          cat work/adapter/install.txt

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "ERROR: Adapter installation failed."
            exit "$STATUS"
          fi

          echo
          echo "============================================================"
          echo "ADAPTER LIST"
          echo "============================================================"

          "$FLUTTERDEC" \
            adapter list \
            > work/adapter/list.txt \
            2>&1

          cat work/adapter/list.txt

      # ============================================================
      # 10. VERIFY INFO AFTER ADAPTER
      # ============================================================
      - name: Verify adapter with Flutterdec info
        shell: bash
        run: |
          set +e

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info-after-adapter.json \
            2> work/info/info-after-adapter.stderr

          STATUS=$?

          echo "Info exit code:"
          echo "$STATUS"

          echo
          echo "INFO AFTER ADAPTER:"
          cat work/info/info-after-adapter.json || true

          echo
          echo "STDERR:"
          cat work/info/info-after-adapter.stderr || true

          exit 0

      # ============================================================
      # 11. DECOMPILE AOT
      # ============================================================
      - name: Decompile Flutter AOT
        shell: bash
        run: |
          set +e

          rm -rf work/flutterdec-out

          mkdir -p work/flutterdec-out

          echo
          echo "============================================================"
          echo "DECOMPILING LIBAPP.SO"
          echo "============================================================"

          "$FLUTTERDEC" \
            decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --emit-ghidra-script \
            --emit-ida-script \
            --function-scope all \
            > work/flutterdec-out/decompile.log \
            2>&1

          STATUS=$?

          echo
          echo "Decompile exit code:"
          echo "$STATUS"

          echo
          echo "Decompile log:"
          cat work/flutterdec-out/decompile.log \
            || true

          echo
          echo "Generated files:"
          find work/flutterdec-out \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "$STATUS" \
            > work/flutterdec-out/exit-code.txt

          # Flutterdec can generate useful output even when its
          # strict quality gate returns non-zero.
          exit 0

      # ============================================================
      # 12. FIND IMPORTANT FILES
      # ============================================================
      - name: Inspect decompiler output
        shell: bash
        run: |
          set +e

          mkdir -p work/search

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|flashfy_screen.dart|flashfy_controller.dart|torch_service.dart"

          echo "============================================================" \
            > work/search/painter-search.txt

          echo "FLUTTERDEC OUTPUT" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          grep -RniE \
            "$PATTERN" \
            work/flutterdec-out \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          echo \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          echo "RAW STRINGS" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          strings \
            -a \
            -t x \
            work/libapp.so \
            | grep -Ei \
              "$PATTERN" \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          cat work/search/painter-search.txt

      # ============================================================
      # 13. EXTRACT PSEUDOCODE
      # ============================================================
      - name: Collect recovered pseudocode
        shell: bash
        run: |
          set +e

          mkdir -p work/recovered

          find work/flutterdec-out \
            -type f \
            \( \
              -name "*.dartpseudo" \
              -o \
              -name "*.dart" \
              -o \
              -name "*.txt" \
            \) \
            -print \
            | sort \
            > work/recovered/files.txt

          echo
          echo "Recovered source-like files:"
          cat work/recovered/files.txt

          echo
          echo "Searching recovered pseudocode..."

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            grep -niE \
              "_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn" \
              "$FILE" \
              2>/dev/null \
              && echo \
              || true

          done < work/recovered/files.txt \
            > work/recovered/matching-functions.txt

          echo
          echo "Matching recovered functions:"
          cat work/recovered/matching-functions.txt \
            || true

      # ============================================================
      # 14. ELF INFORMATION
      # ============================================================
      - name: Inspect ELF
        shell: bash
        run: |
          set +e

          mkdir -p work/elf

          file work/libapp.so \
            > work/elf/file.txt \
            2>&1

          readelf -h \
            work/libapp.so \
            > work/elf/header.txt \
            2>&1

          readelf -S \
            work/libapp.so \
            > work/elf/sections.txt \
            2>&1

          readelf -l \
            work/libapp.so \
            > work/elf/program-headers.txt \
            2>&1

          echo "=== FILE ==="
          cat work/elf/file.txt || true

          echo
          echo "=== HEADER ==="
          cat work/elf/header.txt || true

          echo
          echo "=== SECTIONS ==="
          cat work/elf/sections.txt || true

      # ============================================================
      # 15. ARM64 DISASSEMBLY
      # ============================================================
      - name: Generate ARM64 disassembly
        shell: bash
        run: |
          set +e

          mkdir -p work/disassembly

          objdump \
            -d \
            -M no-aliases \
            work/libapp.so \
            > work/disassembly/libapp-objdump.txt \
            2>&1

          echo "objdump status:"
          echo "$?"

          wc -l \
            work/disassembly/libapp-objdump.txt \
            || true

      # ============================================================
      # 16. SEARCH ALL OUTPUT FOR PAINTER FUNCTIONS
      # ============================================================
      - name: Deep search recovered output
        shell: bash
        run: |
          set +e

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService"

          grep -RniE \
            "$PATTERN" \
            work \
            > work/search/all-matches.txt \
            2>&1 \
            || true

          echo
          echo "============================================================"
          echo "ALL MATCHES"
          echo "============================================================"

          cat work/search/all-matches.txt \
            || true

      # ============================================================
      # 17. COPY FLUTTER ASSETS
      # ============================================================
      - name: Extract Flutter assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"

            mkdir -p \
              "work/assets/$NAME"

            unzip \
              -q \
              -o \
              "$APK" \
              "assets/flutter_assets/assets/*" \
              -d \
              "work/assets/$NAME" \
              2>/dev/null \
              || true

          done < work/apk-list.txt

          find work/assets \
            -type f \
            -printf "%p %s bytes\n" \
            | sort \
            > work/assets/list.txt

          cat work/assets/list.txt

      # ============================================================
      # 18. FINAL SUMMARY
      # ============================================================
      - name: Create final summary
        shell: bash
        run: |
          set +e

          mkdir -p work/final

          {
            echo "============================================================"
            echo "FLASHFY AOT ANALYSIS"
            echo "============================================================"
            echo

            echo "Snapshot hash:"
            cat work/snapshot-hash.txt \
              2>/dev/null \
              || true

            echo

            echo "libapp SHA256:"
            cat work/libapp.sha256 \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "ADAPTER INSTALL"
            echo "============================================================"

            cat work/adapter/install.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "ADAPTER LIST"
            echo "============================================================"

            cat work/adapter/list.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "FLUTTERDEC INFO"
            echo "============================================================"

            cat work/info/info-after-adapter.json \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "DECOMPILE LOG"
            echo "============================================================"

            cat work/flutterdec-out/decompile.log \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "RECOVERED PAINTER FUNCTIONS"
            echo "============================================================"

            cat work/recovered/matching-functions.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "SEARCH RESULTS"
            echo "============================================================"

            cat work/search/all-matches.txt \
              2>/dev/null \
              || true

          } > work/final/FINAL-SUMMARY.txt

          cat work/final/FINAL-SUMMARY.txt

      # ============================================================
      # 19. UPLOAD COMPLETE RAW ANALYSIS
      # ============================================================
      - name: Upload complete AOT analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Raw-Analysis
          path: work
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 20. UPLOAD DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Diagnostics
          path: |
            work/final/FINAL-SUMMARY.txt
            work/search/painter-search.txt
            work/search/all-matches.txt
            work/recovered/matching-functions.txt
            work/flutterdec-out/report.json
            work/flutterdec-out/quality.json
            work/flutterdec-out/decompile.log
          if-no-files-found: warn
          retention-days: 14
