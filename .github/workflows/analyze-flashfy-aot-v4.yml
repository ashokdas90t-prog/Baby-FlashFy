name: analyze-flashfy-aot-v4

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Flutterdec alpha.4
        run: |
          set -eux
          curl -L --fail --retry 3 -o /tmp/flutterdec.tar.gz https://github.com/JohnMurray/flutterdec/releases/download/v0.1.0-alpha.4/flutterdec-v0.1.0-alpha.4-linux-x64.tar.gz
          mkdir -p /opt/flutterdec
          tar -xzf /tmp/flutterdec.tar.gz -C /opt/flutterdec --strip-components=1
          chmod +x /opt/flutterdec/bin/flutterdec
      - name: Locate APK and extract libapp.so
        run: |
          set -eux
          APK="$(find . -type f -name '*.apk' | head -1)"
          test -n "$APK"
          mkdir -p analysis/apk analysis/out
          cp "$APK" analysis/apk/input.apk
          unzip -j -o "$APK" 'lib/arm64-v8a/libapp.so' -d analysis/apk/
          test -s analysis/apk/libapp.so
          /opt/flutterdec/bin/flutterdec info analysis/apk/libapp.so --json > analysis/out/flutterdec-info.json || true
      - name: Discover Dart hash and adapter status
        run: |
          set -eux
          export FLUTTERDEC_DATA_DIR=/opt/flutterdec/share/flutterdec
          export FLUTTERDEC_ADAPTER_STORE="$PWD/analysis/adapter-store"
          mkdir -p "$FLUTTERDEC_ADAPTER_STORE"
          /opt/flutterdec/bin/flutterdec info analysis/apk/libapp.so --json | tee analysis/out/info.json || true
          /opt/flutterdec/bin/flutterdec adapter list --json | tee analysis/out/adapters-before.json || true
          HASH="$(python3 - <<'PY'
          import json
          try: d=json.load(open('analysis/out/info.json'))
          except Exception: d={}
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if 'hash' in k.lower() and isinstance(v,str) and len(v)>=16: return v
                      r=walk(v)
                      if r: return r
              elif isinstance(x,list):
                  for v in x:
                      r=walk(v)
                      if r: return r
              return ''
          print(walk(d))
          PY
          )"
          echo "DART_HASH=$HASH" | tee analysis/out/dart-hash.txt
          if [ -n "$HASH" ]; then /opt/flutterdec/bin/flutterdec adapter install --dart-hash "$HASH" --target-arch arm64 | tee analysis/out/adapter-install.txt || true; fi
          /opt/flutterdec/bin/flutterdec adapter list --json | tee analysis/out/adapters-after.json || true
      - name: Run AOT static analysis
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install capstone pyelftools
          git clone --depth 1 https://github.com/BroNils/aotopsy.git analysis/aotopsy
          python3 -m pip install -e analysis/aotopsy || true
          mkdir -p analysis/out/aotopsy
          if command -v aotopsy >/dev/null 2>&1; then aotopsy analysis/apk/libapp.so --output analysis/out/aotopsy || true; else python3 -m aotopsy analysis/apk/libapp.so --output analysis/out/aotopsy || true; fi
          find analysis/out/aotopsy -maxdepth 4 -type f -print | sort || true
      - name: Flutterdec decompile with asm and IR
        run: |
          set -eux
          export FLUTTERDEC_DATA_DIR=/opt/flutterdec/share/flutterdec
          export FLUTTERDEC_ADAPTER_STORE="$PWD/analysis/adapter-store"
          mkdir -p analysis/out/flutterdec
          /opt/flutterdec/bin/flutterdec decompile analysis/apk/libapp.so -o analysis/out/flutterdec --emit-asm --emit-ir --verbose || true
          find analysis/out/flutterdec -maxdepth 4 -type f -print | sort || true
      - name: Extract FlashFy painter symbols
        run: |
          set -eux
          strings -t x analysis/apk/libapp.so > analysis/out/strings.txt
          grep -E '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|isFlashOn|toggleFlash' analysis/out/strings.txt | tee analysis/out/flashfy-symbols.txt || true
          readelf -S analysis/apk/libapp.so > analysis/out/elf-sections.txt
          objdump -d analysis/apk/libapp.so > analysis/out/libapp-aarch64-objdump.txt || true
      - name: Package diagnostics
        run: tar -czf flashfy-aot-diagnostics.tar.gz analysis/out
