name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check APK inputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/input

          for f in \
            base.apk \
            split_config.arm64_v8a.apk \
            split_config.en.apk \
            split_config.xxhdpi.apk
          do
            if [ ! -f "$f" ]; then
              echo "Missing APK: $f"
              exit 1
            fi
            cp "$f" work/input/
          done

          echo "APK inputs OK:"
          ls -lh work/input/

      - name: Download APKEditor 1.4.9
        shell: bash
        run: |
          set -euo pipefail

          # Fixed release asset URL; do not use latest/download.
          URL="https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"

          curl -fL --retry 5 --retry-delay 2 \
            "$URL" \
            -o APKEditor.jar

          test -s APKEditor.jar

          echo "APKEditor downloaded:"
          ls -lh APKEditor.jar

          java -jar APKEditor.jar -version || \
          java -jar APKEditor.jar -v || true

      - name: Merge split APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/merged

          java -jar APKEditor.jar \
            m \
            -i work/input \
            -o work/flashfy.apk

          test -s work/flashfy.apk

          echo "Merged APK:"
          ls -lh work/flashfy.apk

      - name: Download flutterdec release
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/caverav/flutterdec/releases/download/v0.1.0-alpha.4/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          curl -fL --retry 5 --retry-delay 2 \
            "$URL" \
            -o flutterdec.tar.gz

          test -s flutterdec.tar.gz

          rm -rf flutterdec-prefix
          mkdir -p flutterdec-prefix

          tar -xzf flutterdec.tar.gz \
            -C flutterdec-prefix \
            --strip-components=1

          echo "flutterdec files:"
          find flutterdec-prefix -maxdepth 4 -type f | sort | head -150

          test -x flutterdec-prefix/bin/flutterdec

          # Release must contain its bundled data.
          test -f flutterdec-prefix/share/flutterdec/adapters/registry.json

          echo "$GITHUB_WORKSPACE/flutterdec-prefix/bin" >> "$GITHUB_PATH"

      - name: Inspect Flutter AOT snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          flutterdec info \
            work/flashfy.apk \
            --json \
            | tee work/info-before.json

          HASH="$(python3 - <<'PY'
          import json

          with open("work/info-before.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["snapshot_hash"])
          PY
          )"

          DART_VERSION="$(python3 - <<'PY'
          import json

          with open("work/info-before.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("dart_version", "unknown"))
          PY
          )"

          echo "Detected snapshot hash: $HASH"
          echo "Detected Dart version: $DART_VERSION"

          # This is the snapshot from the current FlashFy APK.
          EXPECTED="78da37fed6bf1489361a312568249f3f"

          if [ "$HASH" != "$EXPECTED" ]; then
            echo "ERROR: unexpected snapshot hash"
            echo "Expected: $EXPECTED"
            echo "Actual:   $HASH"
            exit 1
          fi

          echo "SNAPSHOT_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Install matching Dart AOT adapter
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/adapter-store"
          mkdir -p "$GITHUB_WORKSPACE/adapter-store"

          export FLUTTERDEC_ADAPTER_STORE="$GITHUB_WORKSPACE/adapter-store"

          echo "Installing adapter for:"
          echo "$SNAPSHOT_HASH"

          flutterdec adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            | tee work/adapter-install.json

          echo
          echo "Adapter list:"
          flutterdec adapter list --json \
            | tee work/adapter-list.json

          python3 - <<'PY'
          import json

          with open("work/adapter-list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(json.dumps(data, indent=2))

          text = json.dumps(data).lower()

          if "verified" not in text:
              raise SystemExit(
                  "ERROR: matching adapter is not verified."
              )

          if "78da37fed6bf1489361a312568249f3f" not in text:
              raise SystemExit(
                  "ERROR: expected snapshot hash is not present "
                  "in adapter list."
              )

          print("MATCHING VERIFIED ADAPTER FOUND.")
          PY

      - name: Decompile Flutter AOT
        shell: bash
        env:
          FLUTTERDEC_ADAPTER_STORE: ${{ github.workspace }}/adapter-store
        run: |
          set +e

          rm -rf work/decompile
          mkdir -p work/decompile

          flutterdec decompile \
            work/flashfy.apk \
            -o work/decompile \
            --emit-asm \
            --emit-ir \
            --emit-ghidra-script \
            --emit-ida-script

          RC=$?

          echo "flutterdec exit code: $RC"

          # Keep going if flutterdec produced useful output.
          if [ -z "$(find work/decompile -type f -print -quit)" ]; then
            echo "No decompile artifacts were produced."
            exit "$RC"
          fi

          exit 0

      - name: Extract libapp.so
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/native

          unzip -p \
            work/flashfy.apk \
            lib/arm64-v8a/libapp.so \
            > work/native/libapp.so

          test -s work/native/libapp.so

          ls -lh work/native/libapp.so

      - name: Locate FlashFy painter functions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/focused

          strings -t x work/native/libapp.so \
            | grep -E \
            '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|isFlashOn|FlashfyScreen|_FlashfyScreenState' \
            | tee work/focused/painter-strings.txt || true

          echo
          echo "Searching decompiler output..."

          grep -RniE \
            '_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|isFlashOn|FlashfyScreen|_FlashfyScreenState' \
            work/decompile \
            > work/focused/painter-decompile.txt || true

          echo
          echo "Decompile files:"
          find work/decompile \
            -type f \
            | sort \
            | tee work/focused/decompile-files.txt

      - name: Build final report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "FlashFy Flutter AOT Analysis"
            echo "============================="
            echo
            echo "Snapshot hash: $SNAPSHOT_HASH"
            echo
            echo "=== Flutterdec info ==="
            cat work/info-before.json
            echo
            echo "=== Adapter install ==="
            cat work/adapter-install.json || true
            echo
            echo "=== Adapter list ==="
            cat work/adapter-list.json || true
            echo
            echo "=== Painter/native strings ==="
            cat work/focused/painter-strings.txt || true
            echo
            echo "=== Painter references in decompiler ==="
            cat work/focused/painter-decompile.txt || true
            echo
            echo "=== Decompile files ==="
            cat work/focused/decompile-files.txt || true
          } > work/focused/REPORT.txt

          cat work/focused/REPORT.txt

      - name: Upload AOT analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-analysis
          path: |
            work/info-before.json
            work/adapter-install.json
            work/adapter-list.json
            work/decompile/**
            work/native/libapp.so
            work/focused/**
