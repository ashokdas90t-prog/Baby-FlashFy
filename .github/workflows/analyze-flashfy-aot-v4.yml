name: analyze-aot

on:
  workflow_dispatch:

jobs:
  analyze-aot:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT FLASHFY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSPECT REPOSITORY
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 5 -type f | sort | head -1000

      # ============================================================
      # 3. LOCATE APK FILES
      # ============================================================
      - name: Locate APK files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work

          find . \
            -type f \
            -iname "*.apk" \
            -print \
            | sort \
            | tee work/apk-list.txt

          if ! grep -q "\.apk$" work/apk-list.txt; then
            echo "ERROR: No APK found."
            exit 1
          fi

      # ============================================================
      # 4. EXTRACT ARM64 LIBAPP.SO
      # ============================================================
      - name: Extract ARM64 libapp.so
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/apk-unpacked

          FOUND=""

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"
            OUT="work/apk-unpacked/$NAME"

            rm -rf "$OUT"
            mkdir -p "$OUT"

            echo
            echo "Checking:"
            echo "$APK"

            unzip -q "$APK" -d "$OUT"

            LIBAPP="$(
              find "$OUT" \
                -type f \
                -path "*/lib/arm64-v8a/libapp.so" \
                | head -n 1
            )"

            if [ -n "$LIBAPP" ]; then

              echo
              echo "FOUND:"
              echo "$LIBAPP"

              cp "$LIBAPP" work/libapp.so

              echo "$APK" > work/libapp-source.txt

              FOUND="yes"
              break

            fi

          done < work/apk-list.txt

          if [ -z "$FOUND" ]; then
            echo "ERROR: ARM64 libapp.so not found."
            exit 1
          fi

          echo
          file work/libapp.so

          echo
          ls -lh work/libapp.so

          sha256sum work/libapp.so \
            | tee work/libapp.sha256

      # ============================================================
      # 5. DOWNLOAD FLUTTERDEC BINARY + MATCHING PACKAGE DATA
      # ============================================================
      - name: Download Flutterdec alpha.4
        shell: bash
        run: |
          set -euo pipefail

          VERSION="v0.1.0-alpha.4"

          URL="https://github.com/caverav/flutterdec/releases/download/${VERSION}/flutterdec-v0.1.0-alpha.4-Linux-X64.tar.gz"

          rm -rf work/flutterdec

          mkdir -p work/flutterdec

          echo
          echo "============================================================"
          echo "DOWNLOADING FLUTTERDEC BINARY"
          echo "============================================================"

          echo "URL:"
          echo "$URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            "$URL" \
            -o work/flutterdec/flutterdec.tar.gz

          echo
          echo "============================================================"
          echo "RELEASE ARCHIVE CONTENTS"
          echo "============================================================"

          tar \
            -tzf \
            work/flutterdec/flutterdec.tar.gz

          rm -rf work/flutterdec/release

          mkdir -p work/flutterdec/release

          tar \
            -xzf \
            work/flutterdec/flutterdec.tar.gz \
            -C \
            work/flutterdec/release

          echo
          echo "============================================================"
          echo "FIND FLUTTERDEC EXECUTABLE"
          echo "============================================================"

          BIN="$(
            find work/flutterdec/release \
              -type f \
              -name "flutterdec" \
              | head -n 1
          )"

          if [ -z "$BIN" ]; then
            echo "ERROR: Flutterdec executable not found."
            exit 1
          fi

          chmod +x "$BIN"

          echo "Flutterdec binary:"
          echo "$BIN"

          # --------------------------------------------------------
          # The downloaded release currently contains the executable
          # without the package-data directory.
          #
          # Flutterdec requires:
          #
          #   adapters/registry.json
          #   data/*.json
          #   adapters/python/adapter_template.py
          #
          # Get those exact files from the matching alpha.4 source.
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "CHECKOUT MATCHING FLUTTERDEC SOURCE"
          echo "============================================================"

          rm -rf work/flutterdec/source

          git clone \
            --depth 1 \
            --branch "$VERSION" \
            https://github.com/caverav/flutterdec.git \
            work/flutterdec/source

          echo
          echo "Flutterdec source commit:"
          git -C work/flutterdec/source rev-parse HEAD

          echo
          echo "============================================================"
          echo "VERIFY MATCHING PACKAGE DATA"
          echo "============================================================"

          test -f \
            work/flutterdec/source/adapters/registry.json

          test -f \
            work/flutterdec/source/adapters/python/adapter_template.py

          test -d \
            work/flutterdec/source/data

          echo "registry.json: OK"
          echo "adapter_template.py: OK"
          echo "runtime data directory: OK"

          # --------------------------------------------------------
          # Create a proper Flutterdec data directory.
          # --------------------------------------------------------

          rm -rf work/flutterdec/data

          mkdir -p \
            work/flutterdec/data/adapters/python

          mkdir -p \
            work/flutterdec/data/data

          cp \
            work/flutterdec/source/adapters/registry.json \
            work/flutterdec/data/adapters/registry.json

          cp \
            work/flutterdec/source/adapters/python/adapter_template.py \
            work/flutterdec/data/adapters/python/adapter_template.py

          cp \
            work/flutterdec/source/data/*.json \
            work/flutterdec/data/data/

          echo
          echo "============================================================"
          echo "FLUTTERDEC PACKAGE DATA"
          echo "============================================================"

          find work/flutterdec/data \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "============================================================"
          echo "VERIFY REGISTRY"
          echo "============================================================"

          REGISTRY="work/flutterdec/data/adapters/registry.json"

          ls -lh "$REGISTRY"

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/flutterdec/data/adapters/registry.json")

          data = json.loads(
              p.read_text(
                  encoding="utf-8"
              )
          )

          print("Registry JSON: valid")

          if isinstance(data, dict):
              print("Top-level keys:")
              for key in data.keys():
                  print(" -", key)
          elif isinstance(data, list):
              print("Registry records:", len(data))
          else:
              print("Registry type:", type(data).__name__)
          PY

          echo
          echo "============================================================"
          echo "SET FLUTTERDEC ENVIRONMENT"
          echo "============================================================"

          echo "FLUTTERDEC=$BIN" \
            >> "$GITHUB_ENV"

          echo "FLUTTERDEC_DATA_DIR=$GITHUB_WORKSPACE/work/flutterdec/data" \
            >> "$GITHUB_ENV"

          echo
          echo "Flutterdec:"
          "$BIN" --version

      # ============================================================
      # 6. PREPARE ADAPTER STORE
      # ============================================================
      - name: Prepare Flutterdec adapter store
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/work/flutterdec-adapters"

          mkdir -p \
            "$GITHUB_WORKSPACE/work/xdg-data"

          echo "FLUTTERDEC_ADAPTER_STORE=$GITHUB_WORKSPACE/work/flutterdec-adapters" \
            >> "$GITHUB_ENV"

          echo "XDG_DATA_HOME=$GITHUB_WORKSPACE/work/xdg-data" \
            >> "$GITHUB_ENV"

          echo
          echo "Adapter store:"
          echo "$GITHUB_WORKSPACE/work/flutterdec-adapters"

      # ============================================================
      # 7. FLUTTERDEC INFO
      # ============================================================
      - name: Flutterdec info
        shell: bash
        run: |
          set +e

          mkdir -p work/info

          echo
          echo "============================================================"
          echo "FLUTTERDEC INFO"
          echo "============================================================"

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info.json \
            2> work/info/info.stderr

          STATUS=$?

          echo
          echo "Flutterdec info exit code:"
          echo "$STATUS"

          echo
          echo "INFO JSON:"
          cat work/info/info.json || true

          echo
          echo "INFO STDERR:"
          cat work/info/info.stderr || true

          exit 0

      # ============================================================
      # 8. DETECT DART SNAPSHOT HASH
      # ============================================================
      - name: Detect Dart snapshot hash
        shell: bash
        run: |
          set -euo pipefail

          HASH=""

          if [ -s work/info/info.json ]; then

            HASH="$(
              python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("work/info/info.json")

          try:
              data = json.loads(
                  p.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )
          except Exception as exc:
              print(
                  f"Could not parse info.json: {exc}",
                  flush=True
              )
              raise SystemExit(0)

          value = data.get("snapshot_hash")

          if isinstance(value, str):
              value = value.strip().lower()

              if len(value) == 32:
                  print(value)
          PY
            )"

          fi

          if [ -z "$HASH" ]; then
            echo
            echo "ERROR: snapshot_hash was not found."

            echo
            echo "Flutterdec info:"
            cat work/info/info.json || true

            echo
            echo "Flutterdec stderr:"
            cat work/info/info.stderr || true

            exit 1
          fi

          echo
          echo "============================================================"
          echo "DART SNAPSHOT HASH"
          echo "============================================================"

          echo "$HASH"

          echo "$HASH" \
            > work/snapshot-hash.txt

          echo "SNAPSHOT_HASH=$HASH" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 9. CHECK MATCHING REGISTRY RECORD
      # ============================================================
      - name: Check matching adapter registry
        shell: bash
        run: |
          set +e

          mkdir -p work/adapter

          echo
          echo "============================================================"
          echo "ADAPTER REGISTRY CHECK"
          echo "============================================================"

          echo "Snapshot:"
          echo "$SNAPSHOT_HASH"

          echo
          echo "Registry:"
          ls -lh \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json"

          echo
          echo "Searching registry..."

          grep -ni \
            "$SNAPSHOT_HASH" \
            "$FLUTTERDEC_DATA_DIR/adapters/registry.json" \
            > work/adapter/registry-match.txt \
            2>&1

          STATUS=$?

          echo
          echo "Registry search exit code:"
          echo "$STATUS"

          cat work/adapter/registry-match.txt \
            || true

          echo
          echo "Adapter list BEFORE install:"

          "$FLUTTERDEC" \
            adapter list \
            --json \
            > work/adapter/list-before.json \
            2>&1

          LIST_STATUS=$?

          echo
          echo "Adapter list exit code:"
          echo "$LIST_STATUS"

          cat work/adapter/list-before.json \
            || true

          # Do not stop here.
          # Install step gives the authoritative result.
          exit 0

      # ============================================================
      # 10. INSTALL MATCHING FLUTTERDEC ADAPTER
      # ============================================================
      - name: Install matching Flutterdec adapter
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "INSTALLING MATCHING ADAPTER"
          echo "============================================================"

          echo "Snapshot:"
          echo "$SNAPSHOT_HASH"

          rm -f \
            work/adapter/install.json \
            work/adapter/install.txt

          "$FLUTTERDEC" \
            adapter install \
            --dart-hash "$SNAPSHOT_HASH" \
            --json \
            > work/adapter/install.json \
            2> work/adapter/install.txt

          STATUS=$?

          echo
          echo "Adapter install exit code:"
          echo "$STATUS"

          echo
          echo "Adapter install stdout:"
          cat work/adapter/install.json \
            || true

          echo
          echo "Adapter install stderr:"
          cat work/adapter/install.txt \
            || true

          echo
          echo "============================================================"
          echo "ADAPTER LIST AFTER INSTALL"
          echo "============================================================"

          "$FLUTTERDEC" \
            adapter list \
            --json \
            > work/adapter/list-after.json \
            2>&1

          LIST_STATUS=$?

          echo
          echo "Adapter list exit code:"
          echo "$LIST_STATUS"

          cat work/adapter/list-after.json \
            || true

          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "ERROR: Adapter installation failed."
            exit "$STATUS"
          fi

      # ============================================================
      # 11. VERIFY ADAPTER
      # ============================================================
      - name: Verify adapter with Flutterdec info
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "INFO AFTER ADAPTER INSTALL"
          echo "============================================================"

          "$FLUTTERDEC" \
            info \
            work/libapp.so \
            --json \
            > work/info/info-after-adapter.json \
            2> work/info/info-after-adapter.stderr

          STATUS=$?

          echo
          echo "Info exit code:"
          echo "$STATUS"

          echo
          echo "INFO:"
          cat work/info/info-after-adapter.json \
            || true

          echo
          echo "STDERR:"
          cat work/info/info-after-adapter.stderr \
            || true

          exit 0

      # ============================================================
      # 12. DECOMPILE FLUTTER AOT
      # ============================================================
      - name: Decompile Flutter AOT
        shell: bash
        run: |
          set +e

          rm -rf work/flutterdec-out

          mkdir -p work/flutterdec-out

          echo
          echo "============================================================"
          echo "DECOMPILING LIBAPP.SO"
          echo "============================================================"

          "$FLUTTERDEC" \
            decompile \
            work/libapp.so \
            -o work/flutterdec-out \
            --emit-asm \
            --emit-ir \
            --emit-ghidra-script \
            --emit-ida-script \
            --function-scope all \
            > work/flutterdec-out/decompile.log \
            2>&1

          STATUS=$?

          echo
          echo "Decompile exit code:"
          echo "$STATUS"

          echo
          echo "Decompile log:"
          cat work/flutterdec-out/decompile.log \
            || true

          echo
          echo "Generated files:"

          find work/flutterdec-out \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo "$STATUS" \
            > work/flutterdec-out/exit-code.txt

          # Keep artifacts even if quality gate returns non-zero.
          exit 0

      # ============================================================
      # 13. SEARCH PAINTER FUNCTIONS
      # ============================================================
      - name: Inspect decompiler output
        shell: bash
        run: |
          set +e

          mkdir -p work/search

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService|flashfy_screen.dart|flashfy_controller.dart|torch_service.dart"

          echo "============================================================" \
            > work/search/painter-search.txt

          echo "FLUTTERDEC OUTPUT" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          grep -RniE \
            "$PATTERN" \
            work/flutterdec-out \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          echo \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          echo "RAW STRINGS" \
            >> work/search/painter-search.txt

          echo "============================================================" \
            >> work/search/painter-search.txt

          strings \
            -a \
            -t x \
            work/libapp.so \
            | grep -Ei \
              "$PATTERN" \
            >> work/search/painter-search.txt \
            2>&1 \
            || true

          echo
          echo "Painter search:"
          cat work/search/painter-search.txt

      # ============================================================
      # 14. COLLECT RECOVERED PSEUDOCODE
      # ============================================================
      - name: Collect recovered pseudocode
        shell: bash
        run: |
          set +e

          mkdir -p work/recovered

          find work/flutterdec-out \
            -type f \
            \( \
              -name "*.dartpseudo" \
              -o \
              -name "*.dart" \
              -o \
              -name "*.txt" \
            \) \
            -print \
            | sort \
            > work/recovered/files.txt

          echo
          echo "Recovered source-like files:"
          cat work/recovered/files.txt

          echo
          echo "Searching recovered pseudocode..."

          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            grep -niE \
              "_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn" \
              "$FILE" \
              2>/dev/null \
              && echo \
              || true

          done < work/recovered/files.txt \
            > work/recovered/matching-functions.txt

          echo
          echo "Matching recovered functions:"
          cat work/recovered/matching-functions.txt \
            || true

      # ============================================================
      # 15. INSPECT ELF
      # ============================================================
      - name: Inspect ELF
        shell: bash
        run: |
          set +e

          mkdir -p work/elf

          file \
            work/libapp.so \
            > work/elf/file.txt \
            2>&1

          readelf \
            -h \
            work/libapp.so \
            > work/elf/header.txt \
            2>&1

          readelf \
            -S \
            work/libapp.so \
            > work/elf/sections.txt \
            2>&1

          readelf \
            -l \
            work/libapp.so \
            > work/elf/program-headers.txt \
            2>&1

          echo "=== FILE ==="
          cat work/elf/file.txt || true

          echo
          echo "=== HEADER ==="
          cat work/elf/header.txt || true

          echo
          echo "=== SECTIONS ==="
          cat work/elf/sections.txt || true

      # ============================================================
      # 16. GENERATE ARM64 DISASSEMBLY
      # ============================================================
      - name: Generate ARM64 disassembly
        shell: bash
        run: |
          set +e

          mkdir -p work/disassembly

          objdump \
            -d \
            -M no-aliases \
            work/libapp.so \
            > work/disassembly/libapp-objdump.txt \
            2>&1

          STATUS=$?

          echo "objdump status:"
          echo "$STATUS"

          wc -l \
            work/disassembly/libapp-objdump.txt \
            || true

      # ============================================================
      # 17. DEEP SEARCH
      # ============================================================
      - name: Deep search recovered output
        shell: bash
        run: |
          set +e

          PATTERN="_RopeBulbPainter|_drawBulb|_drawPullRope|_BackgroundPainter|_paintBackgroundImage|_paintBackgroundColor|_drawImageScaledAndCentered|_FlashfyScreenState|FlashfyScreen|FlashfyController|toggleFlash|isFlashOn|TorchService"

          grep -RniE \
            "$PATTERN" \
            work \
            > work/search/all-matches.txt \
            2>&1 \
            || true

          echo
          echo "============================================================"
          echo "ALL MATCHES"
          echo "============================================================"

          cat work/search/all-matches.txt \
            || true

      # ============================================================
      # 18. EXTRACT FLUTTER ASSETS
      # ============================================================
      - name: Extract Flutter assets
        shell: bash
        run: |
          set +e

          mkdir -p work/assets

          while IFS= read -r APK; do

            [ -z "$APK" ] && continue

            NAME="$(basename "$APK" .apk)"

            mkdir -p \
              "work/assets/$NAME"

            unzip \
              -q \
              -o \
              "$APK" \
              "assets/flutter_assets/assets/*" \
              -d \
              "work/assets/$NAME" \
              2>/dev/null \
              || true

          done < work/apk-list.txt

          find work/assets \
            -type f \
            -printf "%p %s bytes\n" \
            | sort \
            > work/assets/list.txt

          cat work/assets/list.txt

      # ============================================================
      # 19. FINAL SUMMARY
      # ============================================================
      - name: Create final summary
        shell: bash
        run: |
          set +e

          mkdir -p work/final

          {
            echo "============================================================"
            echo "FLASHFY AOT ANALYSIS"
            echo "============================================================"
            echo

            echo "Snapshot hash:"
            cat work/snapshot-hash.txt \
              2>/dev/null \
              || true

            echo

            echo "libapp SHA256:"
            cat work/libapp.sha256 \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "REGISTRY MATCH"
            echo "============================================================"

            cat work/adapter/registry-match.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "ADAPTER INSTALL"
            echo "============================================================"

            cat work/adapter/install.json \
              2>/dev/null \
              || true

            echo

            cat work/adapter/install.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "ADAPTER LIST AFTER"
            echo "============================================================"

            cat work/adapter/list-after.json \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "INFO AFTER ADAPTER"
            echo "============================================================"

            cat work/info/info-after-adapter.json \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "DECOMPILE LOG"
            echo "============================================================"

            cat work/flutterdec-out/decompile.log \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "RECOVERED PAINTER FUNCTIONS"
            echo "============================================================"

            cat work/recovered/matching-functions.txt \
              2>/dev/null \
              || true

            echo

            echo "============================================================"
            echo "SEARCH RESULTS"
            echo "============================================================"

            cat work/search/all-matches.txt \
              2>/dev/null \
              || true

          } > work/final/FINAL-SUMMARY.txt

          cat work/final/FINAL-SUMMARY.txt

      # ============================================================
      # 20. UPLOAD COMPLETE ANALYSIS
      # ============================================================
      - name: Upload complete AOT analysis
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Raw-Analysis
          path: work
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 21. UPLOAD DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-AOT-Diagnostics
          path: |
            work/final/FINAL-SUMMARY.txt
            work/search/painter-search.txt
            work/search/all-matches.txt
            work/recovered/matching-functions.txt
            work/adapter/registry-match.txt
            work/adapter/install.json
            work/adapter/install.txt
            work/adapter/list-before.json
            work/adapter/list-after.json
            work/info/info.json
            work/info/info.stderr
            work/info/info-after-adapter.json
            work/info/info-after-adapter.stderr
            work/flutterdec-out/report.json
            work/flutterdec-out/quality.json
            work/flutterdec-out/decompile.log
          if-no-files-found: warn
          retention-days: 14
