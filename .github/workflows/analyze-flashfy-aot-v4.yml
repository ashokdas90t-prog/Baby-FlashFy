name: Analyze FlashFy Flutter AOT

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check APK input
        shell: bash
        run: |
          set -e

          echo "Checking FlashFy APK..."

          test -f split_config.arm64_v8a.apk

          mkdir -p work/native

          echo "APK input OK"

      - name: Extract libapp.so
        shell: bash
        run: |
          set -e

          echo "Extracting Flutter libapp.so..."

          unzip -p \
            split_config.arm64_v8a.apk \
            lib/arm64-v8a/libapp.so \
            > work/native/libapp.so

          test -s work/native/libapp.so

          echo "libapp.so extracted successfully"
          ls -lh work/native/libapp.so

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect AOT snapshot
        shell: bash
        run: |
          set -e

          mkdir -p work

          echo "======================================"
          echo "Flutterdec version"
          echo "======================================"

          nix run github:caverav/flutterdec -- \
            --version || true

          echo
          echo "======================================"
          echo "Flutterdec info"
          echo "======================================"

          set +e

          nix run github:caverav/flutterdec -- \
            info work/native/libapp.so --json \
            2>&1 | tee work/flutterdec-info.log

          RC=${PIPESTATUS[0]}

          set -e

          echo
          echo "flutterdec info exit code: $RC"

          echo
          echo "======================================"
          echo "Searching snapshot hash"
          echo "======================================"

          HASH=$(
            grep -oE \
              '"snapshot_hash"[[:space:]]*:[[:space:]]*"[^"]+"' \
              work/flutterdec-info.log \
              | head -1 \
              | sed -E \
              's/.*"snapshot_hash"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/'
          )

          echo "Detected snapshot hash: $HASH"

          if [ -z "$HASH" ]; then
            echo
            echo "ERROR: snapshot_hash was not found."
            echo
            echo "Complete flutterdec output:"
            cat work/flutterdec-info.log
            exit 1
          fi

          echo "$HASH" > work/snapshot_hash

          echo
          echo "Snapshot hash:"
          cat work/snapshot_hash

          echo
          echo "Expected FlashFy snapshot hash:"
          echo "78da37fed6bf1489361a312568249f3f"

          if [ "$HASH" != "78da37fed6bf1489361a312568249f3f" ]; then
            echo
            echo "ERROR: Unexpected snapshot hash."
            exit 1
          fi

         
